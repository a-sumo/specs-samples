<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Ambient Prototype Retired</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #e7e2dc;
      --ink: #191817;
      --muted: #68615a;
      --panel: rgba(248, 245, 240, 0.82);
      --line: rgba(30, 27, 24, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      display: grid;
      min-height: 100%;
      place-items: center;
      padding: 24px;
    }

    section {
      width: min(420px, 100%);
      border: 1px solid var(--line);
      border-radius: 0;
      background: var(--panel);
      padding: 22px;
      box-shadow: 0 18px 42px rgba(35, 30, 24, 0.12);
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      font-size: 18px;
      font-weight: 820;
      letter-spacing: 0;
    }

    p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <section aria-label="Retired prototype">
      <h1>Ambient Prototype Retired</h1>
      <p>The experimental vector field and Europa audio playback are disabled.</p>
    </section>
  </main>
</body>
</html>
