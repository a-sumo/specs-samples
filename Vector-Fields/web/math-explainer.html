<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nabla Math Explainer</title>
  <link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">
  <style>
    @font-face {
      font-family: NunitoSansLocal;
      src: url("../Assets/Fonts/Nunito_Sans/NunitoSans.ttf");
      font-weight: 200 1000;
    }

    :root {
      --ink: #ffffff;
      --ink-soft: rgba(255, 255, 255, 0.82);
      --ink-quiet: rgba(255, 255, 255, 0.50);
      --x: #e03020;
      --y: #20c030;
      --z: #1878e0;
      --div: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; border-radius: 0 !important; }
    html { background: transparent; }
    body {
      background: transparent;
      font-family: NunitoSansLocal, "Avenir Next", system-ui, sans-serif;
      color: var(--ink);
    }

    #stage {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
      align-items: flex-start;
    }

    /* ── Panel: 1320×428, dark, no border ── */
    .panel {
      position: relative;
      width: 1320px;
      height: 428px;
      overflow: hidden;
      background: transparent;
      display: flex;
      flex-direction: column;
      padding: 28px 52px 22px;
    }

    /* ── Two-column body ── */
    .body-row {
      flex: 1;
      display: flex;
      gap: 0;
      min-height: 0;
    }

    /* Left column: kicker + title + tag pinned to bottom */
    .col-left {
      flex: 0 0 280px;
      display: flex;
      flex-direction: column;
      padding-right: 36px;
      border-right: 1px solid var(--div);
    }

    .kicker {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-quiet);
    }

    .title {
      margin-top: 10px;
      font-size: 48px;
      line-height: 1;
      font-weight: 900;
    }

    .title .op {
      display: block;
      font-family: "KaTeX_Main", NunitoSansLocal, serif;
      font-size: 38px;
      margin-top: 6px;
      color: var(--ink-soft);
    }

    .col-tag {
      margin-top: auto;
      padding-top: 12px;
    }

    .tag {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink-soft);
    }

    .tag .pill {
      padding: 4px 12px;
      border: 1px solid rgba(255,255,255,0.40);
      background: rgba(255,255,255,0.07);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--ink);
      flex-shrink: 0;
    }

    /* Right column: equations or text */
    .col-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 44px;
      gap: 18px;
      min-width: 0;
    }

    /* Equations */
    .eq .katex { color: var(--ink); font-size: 2.6em; }
    .eq.sub .katex { font-size: 1.65em; color: var(--ink-soft); }

    /* Intro / text panels */
    .intro-text {
      font-size: 22px;
      line-height: 1.65;
      font-weight: 600;
      color: var(--ink);
    }

    .intro-text em {
      font-style: normal;
      font-weight: 900;
    }

    .intro-ops {
      display: flex;
      gap: 0;
      margin-top: 8px;
    }

    .intro-op {
      padding: 7px 18px;
      border: 1px solid rgba(255,255,255,0.38);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
    }

    .intro-op + .intro-op { border-left: none; }

    /* Coordinates table (full width, below header row) */
    .coord-header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 6px;
    }

    .coords-table {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
      min-height: 0;
    }

    .coord-row {
      display: flex;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.14);
    }

    .coord-row:last-child { border-bottom: 1px solid rgba(255,255,255,0.14); }

    .coord-name {
      flex: 0 0 160px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-quiet);
      padding: 7px 18px 7px 0;
      border-right: 1px solid rgba(255,255,255,0.14);
    }

    .coord-eq {
      flex: 1;
      padding: 3px 0 3px 24px;
      min-width: 0;
    }

    .coord-eq .katex { color: var(--ink); font-size: 1.30em; }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      flex-shrink: 0;
    }

    .steps { display: flex; gap: 8px; }
    .dot { width: 10px; height: 10px; background: rgba(255,255,255,0.22); }
    .dot.on { width: 28px; background: rgba(255,255,255,0.65); }
    .stepno {
      margin-left: auto;
      font-size: 15px;
      font-weight: 850;
      color: var(--ink-quiet);
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script src="node_modules/katex/dist/katex.min.js"></script>
  <script>
    const C = { x: "#e03020", y: "#20c030", z: "#1878e0" };
    const dx = b => `\\textcolor{${C.x}}{${b}}`;
    const dy = b => `\\textcolor{${C.y}}{${b}}`;
    const dz = b => `\\textcolor{${C.z}}{${b}}`;
    const K = (tex, el, display = true) =>
      katex.render(tex, el, { displayMode: display, throwOnError: false, trust: true, strict: false });

    const STEPS = [
      {
        id: "del_intro",
        type: "intro",
        kicker: "Metrics · Vector Calculus",
        title: "Del / Nabla", op: "∇",
        body: "Del, or nabla, is an operator used in mathematics as a vector differential operator, usually represented by ∇. When applied to a function on a one-dimensional domain, it denotes the standard derivative. When applied to a field on a multi-dimensional domain, it may denote the <em>gradient</em>, the <em>divergence</em>, or the <em>swirl</em> of a vector field.",
        ops: ["gradient", "divergence", "swirl"],
      },
      {
        id: "operator",
        kicker: "Vector Calculus",
        title: "The ∇ operator", op: "∇",
        eqs: [
          { tex: `\\nabla=\\left(${dx("\\tfrac{\\partial}{\\partial x}")},\\;${dy("\\tfrac{\\partial}{\\partial y}")},\\;${dz("\\tfrac{\\partial}{\\partial z}")}\\right)` },
        ],
        tag: { pill: "operator", text: "a vector of partial derivatives" },
      },
      {
        id: "del_coordinates",
        type: "coords",
        kicker: "Vector Calculus",
        title: "Del Operator", op: "∇",
        coords: [
          { name: "Cartesian",   tex: `\\nabla = ${dx("\\dfrac{\\partial}{\\partial x}\\hat{a}_x")} + ${dy("\\dfrac{\\partial}{\\partial y}\\hat{a}_y")} + ${dz("\\dfrac{\\partial}{\\partial z}\\hat{a}_z")}` },
          { name: "Cylindrical", tex: `\\nabla = ${dx("\\dfrac{\\partial}{\\partial \\rho}\\hat{a}_{\\rho}")} + ${dy("\\dfrac{1}{\\rho}\\dfrac{\\partial}{\\partial \\phi}\\hat{a}_{\\phi}")} + ${dz("\\dfrac{\\partial}{\\partial z}\\hat{a}_z")}` },
          { name: "Spherical",   tex: `\\nabla = ${dx("\\dfrac{\\partial}{\\partial r}\\hat{a}_r")} + ${dy("\\dfrac{1}{r}\\dfrac{\\partial}{\\partial \\theta}\\hat{a}_{\\theta}")} + ${dz("\\dfrac{1}{r\\sin\\theta}\\dfrac{\\partial}{\\partial \\phi}\\hat{a}_{\\phi}")}` },
        ],
        tag: null,
      },
      {
        id: "divergence",
        kicker: "∇ applied as a dot product",
        title: "Divergence", op: "∇·F",
        eqs: [
          { tex: `\\nabla\\cdot\\mathbf{F}=${dx("\\frac{\\partial F_x}{\\partial x}")}+${dy("\\frac{\\partial F_y}{\\partial y}")}+${dz("\\frac{\\partial F_z}{\\partial z}")}` },
          { sub: true, tex: `\\nabla\\cdot\\mathbf{F}>0\\Rightarrow\\text{source}\\qquad \\nabla\\cdot\\mathbf{F}<0\\Rightarrow\\text{sink}` },
        ],
        tag: { pill: "scalar", text: "net flow out of a point" },
      },
      {
        id: "divergence_example",
        kicker: "Example · Expanding gas",
        title: "Divergence", op: "∇·F",
        eqs: [
          { tex: `\\mathbf{F}=\\big(${dx("x")},\\,${dy("y")},\\,${dz("z")}\\big)\\quad\\text{outward radial field}` },
          { sub: true, tex: `\\nabla\\cdot\\mathbf{F}=${dx("1")}+${dy("1")}+${dz("1")}=3\\quad\\text{uniform expansion}` },
        ],
        tag: { pill: "source", text: "uniform outflow from every point" },
      },
      {
        id: "curl",
        kicker: "∇ applied as a cross product",
        title: "Swirl", op: "∇×F",
        eqs: [
          { tex: `\\nabla\\times\\mathbf{F}=\\begin{pmatrix} ${dx("\\partial_y F_z-\\partial_z F_y")} \\\\ ${dy("\\partial_z F_x-\\partial_x F_z")} \\\\ ${dz("\\partial_x F_y-\\partial_y F_x")} \\end{pmatrix}` },
        ],
        tag: { pill: "vector", text: "local rotation about each axis" },
      },
      {
        id: "curl_example",
        kicker: "Example · Hurricane",
        title: "Swirl", op: "∇×F",
        eqs: [
          { tex: `\\mathbf{F}=\\big(${dx("-y")},\\,${dy("x")},\\,${dz("0")}\\big)` },
          { sub: true, tex: `\\nabla\\times\\mathbf{F}=\\big(0,\\,0,\\,${dz("2")}\\big)\\quad\\text{swirl axis points upward}` },
        ],
        tag: { pill: "rotation", text: "swirl axis points out of the rotation plane" },
      },
    ];

    const stage = document.getElementById("stage");

    STEPS.forEach((step, i) => {
      const panel = document.createElement("section");
      panel.id = `math_explainer_${step.id}`;
      panel.className = "panel capture";

      if (step.type === "coords") {
        // ── Full-width coords layout ──
        const hdr = document.createElement("div");
        hdr.className = "coord-header";
        const k = document.createElement("span");
        k.className = "kicker";
        k.textContent = step.kicker;
        const t = document.createElement("span");
        t.className = "title";
        t.textContent = step.title;
        const o = document.createElement("span");
        o.className = "op";
        o.style.cssText = "font-family:'KaTeX_Main',serif;font-size:36px;margin-left:10px;color:rgba(255,255,255,0.7)";
        o.textContent = step.op;
        hdr.append(k, t, o);

        const table = document.createElement("div");
        table.className = "coords-table";
        for (const coord of step.coords) {
          const row = document.createElement("div");
          row.className = "coord-row";
          const name = document.createElement("div");
          name.className = "coord-name";
          name.textContent = coord.name;
          const eq = document.createElement("div");
          eq.className = "coord-eq";
          K(coord.tex, eq);
          row.append(name, eq);
          table.appendChild(row);
        }

        const footer = makeFooter(step, i);
        panel.append(hdr, table, footer);

      } else {
        // ── Two-column layout ──
        const bodyRow = document.createElement("div");
        bodyRow.className = "body-row";

        // Left column
        const left = document.createElement("div");
        left.className = "col-left";
        const kicker = document.createElement("div");
        kicker.className = "kicker";
        kicker.textContent = step.kicker;
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = step.title;
        const op = document.createElement("span");
        op.className = "op";
        op.textContent = step.op;
        title.appendChild(op);
        left.append(kicker, title);

        if (step.tag) {
          const colTag = document.createElement("div");
          colTag.className = "col-tag";
          const tag = document.createElement("div");
          tag.className = "tag";
          tag.innerHTML = `<span class="pill">${step.tag.pill}</span><span>${step.tag.text}</span>`;
          colTag.appendChild(tag);
          left.appendChild(colTag);
        }

        // Right column
        const right = document.createElement("div");
        right.className = "col-right";

        if (step.type === "intro") {
          const text = document.createElement("div");
          text.className = "intro-text";
          text.innerHTML = step.body;
          right.appendChild(text);
          if (step.ops) {
            const ops = document.createElement("div");
            ops.className = "intro-ops";
            for (const o of step.ops) {
              const pill = document.createElement("div");
              pill.className = "intro-op";
              pill.textContent = o;
              ops.appendChild(pill);
            }
            right.appendChild(ops);
          }
        } else {
          for (const e of step.eqs) {
            const eq = document.createElement("div");
            eq.className = "eq" + (e.sub ? " sub" : "");
            K(e.tex, eq);
            right.appendChild(eq);
          }
        }

        bodyRow.append(left, right);
        panel.append(bodyRow, makeFooter(step, i));
      }

      stage.appendChild(panel);
    });

    function makeFooter(step, i) {
      const footer = document.createElement("div");
      footer.className = "footer";
      const dots = document.createElement("div");
      dots.className = "steps";
      STEPS.forEach((_, j) => {
        const d = document.createElement("div");
        d.className = "dot" + (j === i ? " on" : "");
        dots.appendChild(d);
      });
      const num = document.createElement("div");
      num.className = "stepno";
      num.textContent = `${i + 1} / ${STEPS.length}`;
      footer.append(dots, num);
      return footer;
    }

    Promise.resolve(document.fonts ? document.fonts.ready : null).then(() => {
      window.mathExplainerReady = true;
    });
  </script>
</body>
</html>
