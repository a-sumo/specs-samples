<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calibration UI Textures</title>
  <style>
    @font-face {
      font-family: NunitoSansLocal;
      src: url("../Assets/Fonts/Nunito_Sans/NunitoSans.ttf");
      font-weight: 200 1000;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
      font-family: NunitoSansLocal, "Avenir Next", system-ui, sans-serif;
      color: #faf7ee;
    }

    body {
      display: grid;
      gap: 28px;
      padding: 48px;
      align-items: start;
      justify-items: start;
    }

    .capture {
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .panel {
      width: 640px;
      height: 236px;
      border-radius: 0;
      border: 3px solid rgba(250, 248, 239, 0.62);
      background:
        radial-gradient(circle at 14% 18%, rgba(255,255,255,0.18), rgba(255,255,255,0) 36%),
        linear-gradient(135deg, rgba(92, 94, 91, 0.92), rgba(49, 51, 50, 0.88));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        inset 0 -28px 58px rgba(0,0,0,0.18),
        0 22px 54px rgba(0,0,0,0.28);
    }

    .panel h1 {
      position: absolute;
      left: 42px;
      top: 34px;
      margin: 0;
      font-size: 54px;
      line-height: 1;
      font-weight: 780;
      letter-spacing: 0;
    }

    .panel p {
      position: absolute;
      left: 44px;
      right: 44px;
      top: 108px;
      margin: 0;
      color: rgba(250, 248, 239, 0.78);
      font-size: 30px;
      line-height: 1.18;
      font-weight: 560;
      letter-spacing: 0;
    }

    .plane {
      width: 512px;
      height: 512px;
      border-radius: 0;
      border: 4px solid rgba(255, 252, 242, 0.62);
      background:
        linear-gradient(rgba(255,252,242,0.18) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255,252,242,0.18) 2px, transparent 2px),
        radial-gradient(circle at 50% 50%, rgba(255,252,242,0.26), rgba(255,252,242,0.08) 44%, rgba(255,252,242,0.02) 72%, rgba(255,252,242,0) 100%);
      background-size: 64px 64px, 64px 64px, 100% 100%;
      box-shadow:
        inset 0 0 34px rgba(255,252,242,0.16),
        0 0 30px rgba(255,252,242,0.12);
    }

    .plane::before,
    .plane::after {
      content: "";
      position: absolute;
      pointer-events: none;
      background: rgba(255,252,242,0.48);
    }

    .plane::before {
      left: 50%;
      top: 0;
      width: 4px;
      height: 100%;
      transform: translateX(-50%);
    }

    .plane::after {
      left: 0;
      top: 50%;
      width: 100%;
      height: 4px;
      transform: translateY(-50%);
    }
  </style>
</head>
<body>
  <section id="calibration_panel" class="capture panel">
    <h1>Set reference plane</h1>
    <p>Align the preview with the field surface. Pinch to confirm.</p>
  </section>
  <div id="preview_plane" class="capture plane"></div>
  <script>
    window.calibrationUiReady = true;
  </script>
</body>
</html>
