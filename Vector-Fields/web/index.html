<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vector Fields Web Labs</title>
  <style>
    :root { color-scheme: dark; --bg:#111; --card:#eeeeea; --ink:#171716; --muted:#6c6a65; --border:#c8c8bf; }
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; background:var(--bg); color:var(--card);
           font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           display:grid; place-items:center; padding:24px; }
    main { width: min(720px, 100%); }
    h1 { margin:0 0 18px; font-size:42px; line-height:1; }
    a { display:block; padding:18px; border:1px solid var(--border); border-radius:14px;
        background:var(--card); color:var(--ink); text-decoration:none; font-weight:800;
        margin-top:12px; }
    span { display:block; margin-top:6px; color:var(--muted); font-weight:650; }
  </style>
</head>
<body>
  <main>
    <h1>Vector Fields Labs</h1>
    <a href="/earth-winds.html">
      Earth winds
      <span>Animated streamlines over a globe. Synthetic wind, OSCAR ocean currents, and jet stream.</span>
    </a>
  </main>
</body>
</html>
