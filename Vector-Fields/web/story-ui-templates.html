<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story UI Templates</title>
  <link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
  <style>
    :root {
      --panel: #202221;
      --panel-2: #2a2d2d;
      --panel-3: #343737;
      --accent: #d8d6cf;
      --line: rgba(232, 229, 220, 0.54);
      --line-soft: rgba(232, 229, 220, 0.18);
      --text: #f4f1e9;
      --muted: #bdb9b1;
      --quiet: #8f8b84;
      --active: #555757;
      --active-ink: #fffaf0;
      --pressed: #3f4242;

      /* Vivid-blue accent system (high saturation, per UI color rules). */
      --accent-blue: #1878e0;
      --accent-blue-bright: #2b8dff;
      --accent-blue-deep: #0f4e9a;
      --blue-edge: rgba(40, 140, 240, 0.92);
      --blue-edge-soft: rgba(40, 140, 240, 0.46);
      --blue-glow: rgba(24, 120, 224, 0.42);
      --blue-glow-soft: rgba(24, 120, 224, 0.22);
      --blue-fill: rgba(30, 110, 210, 0.16);
      --blue-value: #78baff;
      --blue-value-bright: #b8dcff;
      --blue-value-peak: #d4ecff;
      --blue-value-soft: rgba(120, 186, 255, 0.74);
      --blue-value-mid: rgba(64, 152, 255, 0.52);
      --blue-value-faint: rgba(43, 141, 255, 0.32);
      --blue-value-ghost: rgba(43, 141, 255, 0.20);
    }

    @font-face {
      font-family: NunitoSansLocal;
      src: url("../Assets/Fonts/Nunito_Sans/NunitoSans.ttf");
      font-weight: 200 1000;
    }

    * {
      box-sizing: border-box;
      border-radius: 0 !important;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
      color: var(--text);
      font-family: NunitoSansLocal, "Avenir Next", system-ui, sans-serif;
    }

    body {
      display: grid;
      gap: 34px;
      padding: 48px;
      align-items: start;
      justify-items: start;
    }

    .capture {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      color: var(--text);
      background-clip: padding-box;
      box-shadow: none !important;
    }

    .capture::before,
    .capture::after {
      box-shadow: none !important;
    }

    /* Baked mesh-gradient background canvas. Sits inside the element's border
       (inset:0 == padding box) so the border stays visible, and below the
       title underline / content (which get z-index:1). */
    .grad-canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .panel-surface {
      background: #0c1016;
      border: 2px solid rgba(150, 186, 230, 0.30);
      clip-path: inset(0);
      box-shadow:
        inset 0 1px 0 rgba(150, 190, 240, 0.16),
        inset 0 -34px 82px rgba(0,0,0,0.30);
    }

    .panel-surface > .title,
    .panel-surface > .slot,
    .panel-surface > .detail-info,
    .panel-surface > .artemis-map-card,
    .panel-surface > .detail-caption,
    .panel-surface::before,
    .card > :not(.grad-canvas),
    .example-card > :not(.grad-canvas) {
      z-index: 1;
    }

    .panel-surface::before {
      content: "";
      position: absolute;
      left: 70px;
      right: 70px;
      top: 224px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-blue), rgba(43, 141, 255, 0.10));
      box-shadow: 0 0 14px rgba(40, 140, 240, 0.34);
    }

    #examples_panel::before {
      top: 254px;
    }

    .example-detail-panel::before {
      top: 254px;
      background: linear-gradient(90deg, var(--accent-blue) 0%, rgba(43,141,255,0.22) 76%, rgba(43,141,255,0));
    }

    #theory_panel::before {
      top: 254px;
      background: linear-gradient(90deg, rgba(120, 178, 248, 0.66) 0%, rgba(120, 178, 248, 0.16) 76%, rgba(120, 178, 248, 0));
    }

    #theory_panel.panel-surface,
    #theory_panel_motion.panel-surface {
      background: #0d1520;
      border-color: rgba(120, 178, 248, 0.28);
      box-shadow:
        inset 0 1px 0 rgba(150, 200, 255, 0.14),
        inset 0 -34px 82px rgba(0,0,0,0.38);
    }

    .title {
      position: absolute;
      display: flex;
      align-items: center;
      margin: 0;
      color: var(--text);
      font-size: 92px;
      line-height: 1;
      letter-spacing: 0;
      font-weight: 820;
      white-space: normal;
      text-align: left;
    }

    .title.examples {
      font-size: 58px;
      line-height: 0.92;
      font-weight: 780;
    }

    .slot {
      position: absolute;
      border-radius: 0;
      border: 2px solid rgba(150, 186, 230, 0.16);
      background: rgba(80, 150, 240, 0.035);
    }

    .slot.progress {
      border-radius: 0;
      background: rgba(80, 150, 240, 0.028);
    }

    .slot.theory_info {
      border-radius: 0;
      border-color: rgba(150, 186, 230, 0.26);
      background: rgba(80, 150, 240, 0.030);
    }

    .slot.example_info {
      border-radius: 0;
      border-color: rgba(150, 186, 230, 0.26);
      background: rgba(80, 150, 240, 0.030);
    }

    .card {
      background:
        linear-gradient(180deg, rgba(43, 141, 255, 0.38), rgba(43, 141, 255, 0.20)),
        rgba(20, 95, 210, 0.16);
      border: 2px solid rgba(120, 186, 255, 0.76);
      border-radius: 0;
      box-shadow:
        inset 0 1px 0 rgba(184, 220, 255, 0.34),
        0 18px 44px rgba(0,0,0,0.30);
    }

    .main-card-hero {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .main-card-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.04), rgba(0, 0, 0, 0.24)),
        linear-gradient(90deg, rgba(0, 0, 0, 0.48) 0%, rgba(0, 0, 0, 0.08) 48%, rgba(0, 0, 0, 0.20) 100%);
    }

    .card[data-step="theory"] {
      background: transparent;
      border-color: rgba(120, 186, 255, 0.86);
    }

    .card[data-step="theory"]::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 26% 30%, rgba(43, 141, 255, 0.58), transparent 34%),
        radial-gradient(circle at 78% 78%, rgba(43, 141, 255, 0.44), transparent 38%);
      pointer-events: none;
    }

    .main-card-hero.theory {
      opacity: 1;
      background:
        radial-gradient(circle at 70% 26%, rgba(43, 141, 255, 0.54), transparent 37%),
        radial-gradient(circle at 34% 76%, rgba(43, 141, 255, 0.50), transparent 42%);
    }

    .main-card-hero.theory::after {
      background:
        radial-gradient(circle at 24% 50%, rgba(0, 0, 0, 0.44), transparent 42%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.28) 0%, transparent 52%);
    }

    .main-card-hero.theory .formula {
      position: absolute;
      color: var(--blue-value-bright);
      font-size: 31px;
      line-height: 1;
      white-space: nowrap;
      letter-spacing: 0;
      text-shadow: 0 2px 12px rgba(0,0,0,0.45);
    }

    .main-card-hero.theory .formula .katex {
      font-size: 1em;
    }

    .main-card-hero.theory .nabla-formula {
      left: 38px;
      top: 126px;
      font-size: 45px;
      color: var(--blue-value-bright);
    }

    .main-card-hero.theory .nabla-mark {
      right: -54px;
      bottom: -10px;
      font-size: 278px;
      color: rgba(92, 173, 255, 0.72);
    }

    .main-card-hero.theory .nabla-label {
      right: 34px;
      bottom: 140px;
      font-size: 27px;
      color: rgba(139, 198, 255, 0.88);
    }

    .main-card-hero.examples {
      opacity: 1;
      background:
        radial-gradient(circle at 74% 34%, rgba(43, 141, 255, 0.42), transparent 42%),
        radial-gradient(circle at 28% 76%, rgba(24, 120, 224, 0.28), transparent 46%),
        #0d1520;
      filter: none;
    }

    .main-card-hero.examples::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("../Assets/Images/StoryUI/magnetic-field-background.jpg");
      background-size: cover;
      background-position: 50% 50%;
      opacity: 0.36;
      filter: grayscale(1) contrast(1.18) brightness(0.86);
      mix-blend-mode: screen;
    }

    .main-card-hero.examples::after {
      background:
        linear-gradient(180deg, rgba(13, 21, 32, 0.08), rgba(3, 18, 48, 0.36)),
        radial-gradient(circle at 22% 52%, rgba(0, 14, 46, 0.58), rgba(24, 120, 224, 0.08) 44%, rgba(0, 20, 62, 0.24) 100%),
        linear-gradient(90deg, rgba(0, 14, 42, 0.62) 0%, rgba(24, 120, 224, 0.04) 52%, rgba(0, 20, 62, 0.22) 100%);
    }

    .card[data-state="active"] .main-card-hero {
      opacity: 1;
      filter: brightness(1.12) contrast(1.08);
    }

    .card[data-state="active"] .main-card-hero.theory .formula {
      color: var(--blue-value-peak);
    }

    .card[data-state="active"] .main-card-hero.theory .nabla-mark {
      color: rgba(184, 220, 255, 0.88);
    }

    .card[data-state="active"] .main-card-hero.examples {
      filter: brightness(1.06);
    }

    .card[data-state="active"] .main-card-hero.examples::before {
      opacity: 0.42;
      filter: grayscale(1) contrast(1.22) brightness(0.94);
    }

    .card[data-state="pressed"] .main-card-hero.examples {
      filter: brightness(0.90);
    }

    .card[data-state="pressed"] .main-card-hero.examples::before {
      opacity: 0.30;
      filter: grayscale(1) contrast(1.12) brightness(0.76);
    }

    .card[data-state="pressed"] .main-card-hero {
      opacity: 0.78;
      filter: brightness(0.86) contrast(1.12);
    }

    .card[data-state="active"] {
      color: var(--active-ink);
      border-color: var(--blue-edge);
      box-shadow:
        inset 0 0 0 1px rgba(120, 180, 255, 0.20),
        0 0 16px var(--blue-glow-soft),
        0 18px 44px rgba(0,0,0,0.34);
    }

    .card[data-state="pressed"] {
      border-color: var(--blue-edge-soft);
      box-shadow:
        inset 0 0 18px rgba(20, 70, 140, 0.40),
        0 12px 30px rgba(0,0,0,0.30);
    }

    .card[data-kind="theory-card"] {
      background: transparent;
      border-color: rgba(120, 186, 255, 0.82);
      box-shadow:
        inset 0 1px 0 rgba(184, 220, 255, 0.30),
        0 18px 44px rgba(0,0,0,0.24);
    }

    .card[data-kind="theory-card"]::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 30% 22%, rgba(43, 141, 255, 0.46), transparent 38%),
        radial-gradient(circle at 78% 82%, rgba(43, 141, 255, 0.34), transparent 42%);
      pointer-events: none;
    }

    .theory-card-hero {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .theory-card-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 28% 51%, rgba(0, 0, 0, 0.42), transparent 39%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.26), transparent 58%);
    }

    .theory-card-hero .formula {
      position: absolute;
      color: var(--blue-value-bright);
      line-height: 1;
      white-space: nowrap;
      letter-spacing: 0;
      text-shadow: 0 2px 12px rgba(0,0,0,0.42);
    }

    .theory-card-hero .formula .katex {
      font-size: 1em;
    }

    .theory-card-hero .mark {
      right: -34px;
      bottom: -28px;
      font-size: 178px;
      color: rgba(120, 186, 255, 0.68);
    }

    .theory-card-hero .primary {
      left: 28px;
      top: 108px;
      font-size: 38px;
    }

    .theory-card-hero .secondary {
      left: 34px;
      bottom: 86px;
      font-size: 27px;
      color: rgba(184, 220, 255, 0.82);
    }

    .card[data-card="metrics"] .theory-card-hero .primary {
      left: 25px;
      top: 104px;
      font-size: 42px;
    }

    .card[data-card="patterns"] .theory-card-hero .primary {
      left: 24px;
      top: 96px;
      font-size: 35px;
    }

    .card[data-kind="theory-card"][data-state="active"] .theory-card-hero .formula {
      color: var(--blue-value-peak);
    }

    .card[data-kind="theory-card"][data-state="active"] .theory-card-hero .mark {
      color: rgba(184, 220, 255, 0.76);
    }

    .card .num {
      position: absolute;
      left: 30px;
      top: 25px;
      color: rgba(184, 220, 255, 0.82);
      font-size: 28px;
      line-height: 1;
      font-weight: 740;
      letter-spacing: 0.08em;
    }

    .card[data-kind="theory-card"] .num {
      color: rgba(184, 220, 255, 0.86);
    }

    .card[data-state="active"] .num {
      color: #e4e0d4;
    }

    .card h2 {
      position: absolute;
      left: 42px;
      right: 42px;
      top: 50%;
      margin: 0;
      color: currentColor;
      font-size: 58px;
      line-height: 0.96;
      font-weight: 760;
      letter-spacing: 0;
      transform: translateY(-50%);
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      overflow-wrap: normal;
      word-break: normal;
    }

    .card[data-kind="theory-card"] h2 {
      top: 53%;
      font-size: 54px;
      line-height: 0.98;
    }

    .card .num,
    .card h2 {
      z-index: 4;
      text-shadow: 0 3px 18px rgba(0,0,0,0.72);
    }

    .example-card {
      background:
        linear-gradient(180deg, rgba(43, 141, 255, 0.30), rgba(43, 141, 255, 0.14)),
        rgba(20, 95, 210, 0.10);
      border: 2px solid rgba(120, 186, 255, 0.72);
      border-radius: 0;
      box-shadow:
        inset 0 1px 0 rgba(150, 190, 240, 0.10),
        0 20px 48px rgba(0,0,0,0.32);
    }

    .example-card[data-state="active"] {
      color: var(--active-ink);
      border-color: var(--blue-edge);
      box-shadow:
        inset 0 0 0 1px rgba(120, 180, 255, 0.20),
        0 0 16px var(--blue-glow-soft),
        0 22px 52px rgba(0,0,0,0.36);
    }

    .example-card[data-state="pressed"] {
      border-color: var(--blue-edge-soft);
      box-shadow:
        inset 0 0 18px rgba(20, 70, 140, 0.40),
        0 14px 32px rgba(0,0,0,0.32);
    }

    .example-card .example-hero {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.82;
      filter: saturate(1.16) contrast(1.20) brightness(1.62);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, transparent 22%, rgba(0,0,0,0.55) 42%, black 74%);
      mask-image: linear-gradient(90deg, transparent 0%, transparent 22%, rgba(0,0,0,0.55) 42%, black 74%);
    }

    .example-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.48) 0%, rgba(0, 0, 0, 0.34) 28%, rgba(0, 0, 0, 0.08) 52%, rgba(0, 0, 0, 0.00) 100%),
        linear-gradient(180deg, rgba(43, 141, 255, 0.24), rgba(0,0,0,0.04));
    }

    .example-card .num {
      position: absolute;
      z-index: 4;
      left: 46px;
      top: 50%;
      color: rgba(184, 220, 255, 0.82);
      opacity: 1;
      mix-blend-mode: normal;
      font-size: 28px;
      line-height: 1;
      font-weight: 720;
      letter-spacing: 0.08em;
      transform: translateY(-50%);
    }

    .example-card[data-state="active"] .num {
      color: #e4e0d4;
    }

    .example-card h2 {
      position: absolute;
      z-index: 4;
      left: 150px;
      right: 58px;
      top: 50%;
      margin: 0;
      color: var(--text);
      opacity: 1;
      mix-blend-mode: normal;
      font-size: 58px;
      line-height: 0.92;
      font-weight: 730;
      letter-spacing: 0;
      transform: translateY(-50%);
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
    }

    .capture.example-card > .num,
    .capture.example-card > h2 {
      z-index: 4;
      text-shadow: 0 2px 16px rgba(0,0,0,0.66);
    }

    .nav {
      display: grid;
      place-items: center;
      border-radius: 0;
      background:
        linear-gradient(140deg, rgba(40, 120, 220, 0.12), rgba(20, 60, 120, 0.04)),
        #11161f;
      border: 2px solid rgba(150, 186, 230, 0.38);
      color: var(--text);
      font-size: 46px;
      line-height: 1;
      font-weight: 780;
      box-shadow:
        inset 0 1px 0 rgba(150, 190, 240, 0.10),
        0 18px 40px rgba(0,0,0,0.30);
    }

    .nav[data-state="pressed"] {
      background:
        linear-gradient(140deg, rgba(40, 130, 235, 0.22), rgba(20, 70, 140, 0.08)),
        #0e1620;
      border-color: var(--blue-edge-soft);
      box-shadow: inset 0 0 16px rgba(20, 70, 140, 0.42);
    }

    .utility {
      display: grid;
      place-items: center;
      border-radius: 0;
      background:
        linear-gradient(140deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012)),
        #161817;
      border: 2px solid rgba(232, 229, 220, 0.28);
      color: var(--text);
      font-size: 38px;
      line-height: 1;
      font-weight: 650;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 12px 28px rgba(0,0,0,0.28);
    }

    .utility[data-state="off"],
    .utility[data-state="closed"] {
      color: var(--muted);
      background:
        linear-gradient(140deg, rgba(120, 150, 190, 0.05), rgba(255,255,255,0.01)),
        #14181f;
      border-color: rgba(150, 186, 230, 0.22);
    }

    .utility[data-state="pressed"] {
      background:
        linear-gradient(140deg, rgba(40, 130, 235, 0.22), rgba(20, 70, 140, 0.08)),
        #0e1620;
      border-color: var(--blue-edge-soft);
      box-shadow: inset 0 0 14px rgba(20, 70, 140, 0.42);
    }

    .utility.proxy[data-state="on"] {
      background: #1878e0;
      border-color: rgba(224, 240, 255, 0.98);
      color: #ffffff;
      box-shadow:
        inset 0 0 22px rgba(130, 188, 255, 0.50),
        0 12px 30px rgba(0,0,0,0.32);
    }

    .utility.proxy[data-state="off"] {
      color: var(--muted);
      background:
        linear-gradient(140deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012)),
        #161817;
      border-color: rgba(232, 229, 220, 0.28);
    }

    .utility.proxy[data-state="pressed"] {
      background: #2462ce;
      border-color: rgba(240, 248, 255, 0.98);
      color: #fff;
    }

    .slot.example_variant,
    .slot.example_mode {
      border-radius: 0;
      background: rgba(80, 150, 240, 0.028);
      border-color: rgba(150, 186, 230, 0.22);
    }

    .slot.example_variant_artemis {
      border-radius: 0;
      background: rgba(43, 141, 255, 0.045);
      border-color: rgba(92, 173, 255, 0.28);
    }

    .variant {
      border-radius: 0;
      background:
        linear-gradient(140deg, rgba(40, 120, 220, 0.12), rgba(20, 60, 120, 0.03)),
        #11161f;
      border: 2px solid rgba(150, 186, 230, 0.36);
      box-shadow:
        inset 0 1px 0 rgba(150, 190, 240, 0.08),
        0 12px 28px rgba(0,0,0,0.26);
    }

    .variant[data-state="active"] {
      background:
        linear-gradient(140deg, rgba(40, 130, 235, 0.26), rgba(20, 70, 140, 0.08)),
        #122036;
      border-color: var(--blue-edge);
      box-shadow:
        0 0 0 4px var(--blue-glow-soft),
        0 0 18px var(--blue-glow-soft),
        0 14px 32px rgba(0,0,0,0.32);
    }

    .variant[data-state="pressed"] {
      background:
        linear-gradient(140deg, rgba(40, 130, 235, 0.20), rgba(20, 70, 140, 0.06)),
        #0e1620;
      border-color: var(--blue-edge-soft);
      box-shadow: inset 0 0 14px rgba(20, 70, 140, 0.42);
    }

    .variant.artemis-variant {
      border-radius: 0;
      background: #101113;
      border-color: rgba(92, 173, 255, 0.52);
      box-shadow:
        inset 0 1px 0 rgba(139, 198, 255, 0.18),
        0 18px 42px rgba(0,0,0,0.30);
    }

    .variant.artemis-variant::before,
    .variant.artemis-variant::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .variant.artemis-variant::before {
      background-image: url("./assets/orion-nasa-artemis-ii.jpg");
      background-size: cover;
      background-position: 50% 48%;
      filter: saturate(1.04) contrast(1.08) brightness(1.08);
      transform: scale(1.01);
    }

    .variant.artemis-variant::after {
      background:
        linear-gradient(90deg, rgba(8, 9, 10, 0.84), rgba(8, 9, 10, 0.34) 50%, rgba(8, 9, 10, 0.68)),
        linear-gradient(0deg, rgba(43, 141, 255, 0.12), rgba(43, 141, 255, 0));
    }

    .variant.artemis-variant .mission-copy {
      position: absolute;
      left: 48px;
      top: 44px;
      z-index: 1;
      width: 560px;
      color: var(--text);
      text-shadow: 0 2px 14px rgba(0,0,0,0.52);
    }

    .variant.artemis-variant .mission-copy b {
      display: block;
      margin-bottom: 18px;
      font-size: 46px;
      line-height: 1;
      font-weight: 830;
      letter-spacing: 0;
    }

    .variant.artemis-variant .mission-copy span {
      display: block;
      color: rgba(220, 238, 255, 0.90);
      font-size: 25px;
      line-height: 1.24;
      font-weight: 570;
      letter-spacing: 0;
    }

    .variant.artemis-variant[data-state="active"] {
      border-color: var(--blue-edge);
      box-shadow:
        0 0 0 4px var(--blue-glow-soft),
        0 0 18px var(--blue-glow-soft),
        0 18px 42px rgba(0,0,0,0.34);
    }

    .detail-info {
      position: absolute;
      padding: 32px 42px;
      border-radius: 0;
      border: 2px solid rgba(150, 186, 230, 0.28);
      background:
        linear-gradient(135deg, rgba(40,120,220,0.10), rgba(20,60,120,0.03)),
        rgba(14, 20, 30, 0.72);
      box-shadow:
        inset 0 1px 0 rgba(150,190,240,0.12),
        0 18px 42px rgba(0,0,0,0.26);
    }

    .detail-info .kicker {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 24px;
      line-height: 1;
      font-weight: 760;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .detail-info p {
      margin: 0;
      max-width: 1120px;
      color: var(--text);
      font-size: 35px;
      line-height: 1.24;
      font-weight: 520;
      letter-spacing: 0;
    }

    .detail-info .detail-formula {
      margin: 6px 0 26px;
      color: var(--text);
    }

    .detail-info .detail-formula .katex {
      font-size: 50px;
      color: var(--text);
    }

    .detail-info .detail-formula + p {
      text-align: center;
    }

    .detail-info.has-symbols {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 36px;
      text-align: center;
    }

    .detail-info.has-symbols .detail-formula {
      width: 100%;
      margin: 0 0 10px;
      text-align: center;
    }

    .detail-info.has-symbols .detail-formula .katex {
      font-size: 40px;
    }

    .detail-symbols {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 7px 18px;
      width: 100%;
      margin: 0 0 8px;
      color: #d7ebff;
      font-size: 20px;
      line-height: 1.12;
      font-weight: 680;
    }

    .detail-symbol {
      white-space: nowrap;
      text-shadow: 0 2px 10px rgba(0,0,0,0.52);
    }

    .detail-symbol .katex {
      color: #ffffff;
      font-size: 1.12em;
    }

    .detail-info.has-symbols p {
      max-width: 100%;
      font-size: 24px;
      line-height: 1.12;
      text-align: center;
    }

    .artemis-map-card {
      position: absolute;
      left: 70px;
      top: 228px;
      width: 1360px;
      height: 765px;
      border-radius: 0;
      border: 2px solid rgba(92, 173, 255, 0.50);
      background: #101113;
      box-shadow:
        inset 0 1px 0 rgba(139, 198, 255, 0.18),
        0 22px 50px rgba(0,0,0,0.32);
    }

    .artemis-map-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.94) contrast(1.02);
    }

    .artemis-map-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(8, 9, 10, 0.16), rgba(8, 9, 10, 0.02) 42%, rgba(8, 9, 10, 0.18)),
        linear-gradient(90deg, rgba(8, 9, 10, 0.18), rgba(8, 9, 10, 0.02) 38%, rgba(8, 9, 10, 0.08));
      pointer-events: none;
    }

    .detail-caption {
      position: absolute;
      left: 90px;
      color: var(--muted);
      font-size: 25px;
      line-height: 1;
      font-weight: 720;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .theory-section-label {
      position: absolute;
      z-index: 1;
      color: rgba(238, 248, 255, 0.78);
      font-size: 22px;
      line-height: 1;
      font-weight: 840;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: none;
    }

    .overlay {
      background: transparent;
    }

    .overlay::before,
    .overlay::after,
    .cursor::before,
    .cursor::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .overlay.card::before,
    .overlay.example::before {
      inset: 4px;
      border-radius: 0;
      border: 3px solid var(--blue-edge);
      background:
        linear-gradient(90deg, rgba(60,150,255,0.14), rgba(60,150,255,0.02) 34%, rgba(60,150,255,0.08)),
        radial-gradient(circle at 86% 50%, rgba(70,160,255,0.22), rgba(70,160,255,0) 38%);
      box-shadow:
        inset 0 0 28px rgba(50,140,245,0.16),
        0 0 22px rgba(40,140,240,0.34);
    }

    .overlay.card.selected::before,
    .overlay.example.selected::before {
      inset: 3px;
      border-width: 4px;
      border-radius: 0;
      border-color: var(--accent-blue-bright);
      background:
        linear-gradient(90deg, rgba(60,150,255,0.12), rgba(60,150,255,0.02) 44%, rgba(60,150,255,0.07)),
        radial-gradient(circle at 12% 50%, rgba(70,160,255,0.18), rgba(70,160,255,0) 34%);
      box-shadow:
        inset 0 0 28px rgba(50,140,245,0.16),
        0 0 24px rgba(40,140,240,0.36);
    }

    .overlay.card.pressed::before,
    .overlay.example.pressed::before {
      inset: 8px;
      border-width: 3px;
      border-radius: 0;
      border-color: var(--blue-edge-soft);
      background: rgba(40,120,220,0.12);
      box-shadow:
        inset 0 0 24px rgba(40,130,235,0.22),
        0 0 12px rgba(40,140,240,0.24);
    }

    .overlay.nav::before,
    .overlay.utility::before {
      inset: 4px;
      border-radius: 0;
      border: 3px solid var(--blue-edge);
      background:
        linear-gradient(135deg, rgba(60,150,255,0.16), rgba(60,150,255,0.02)),
        radial-gradient(circle at 80% 20%, rgba(70,160,255,0.24), rgba(70,160,255,0) 42%);
      box-shadow:
        0 0 18px rgba(40,140,240,0.34);
    }

    .overlay.nav.pressed::before,
    .overlay.utility.pressed::before {
      inset: 7px;
      border-color: var(--blue-edge-soft);
      background: rgba(40,120,220,0.12);
      box-shadow: inset 0 0 20px rgba(40,130,235,0.24);
    }

    .overlay.utility::before {
      border-radius: 0;
    }

    .cursor {
      width: 72px;
      height: 72px;
      background: transparent;
    }

    .cursor::before {
      inset: 9px;
      border-radius: 0;
      border: 6px solid rgba(150, 200, 255, 0.94);
      box-shadow:
        inset 0 0 12px rgba(90,160,255,0.30),
        0 0 22px rgba(40,140,240,0.42);
    }

    .cursor::after {
      left: 50%;
      top: 50%;
      width: 11px;
      height: 11px;
      border-radius: 0;
      transform: translate(-50%, -50%);
      background: rgba(210, 232, 255, 0.98);
      box-shadow: 0 0 14px rgba(60,150,255,0.50);
    }

    .cursor.pressed::before {
      inset: 13px;
      border-width: 7px;
      background: rgba(60,150,255,0.16);
    }

    .cursor.pressed::after {
      width: 15px;
      height: 15px;
    }

    .panel-cursor-wash {
      width: 256px;
      height: 256px;
      background:
        radial-gradient(circle at 50% 50%,
          rgba(70, 155, 255, 0.42) 0%,
          rgba(60, 145, 250, 0.24) 16%,
          rgba(50, 135, 240, 0.11) 34%,
          rgba(40, 130, 235, 0.04) 56%,
          rgba(40, 130, 235, 0) 74%);
    }

    .panel-cursor-wash::before {
      inset: 58px;
      border-radius: 0;
      border: 4px solid rgba(120, 185, 255, 0.36);
      box-shadow:
        inset 0 0 20px rgba(80,160,255,0.18),
        0 0 26px rgba(40,140,240,0.24);
    }

    .panel-cursor-wash::after {
      inset: 84px;
      border-radius: 0;
      background:
        repeating-linear-gradient(135deg,
          rgba(255,255,255,0.16) 0 4px,
          rgba(255,255,255,0) 4px 12px);
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <script src="./mesh-gradient-bg.js"></script>
  <script src="./story-ui-layout.browser.js"></script>
  <script src="../node_modules/katex/dist/katex.min.js"></script>
  <script>
    const spec = window.STORY_UI_LAYOUT;
    const px = (slot) => {
      const p = slot.px;
      return `left:${p.x}px;top:${p.y}px;width:${p.width}px;height:${p.height}px`;
    };
    const titleBreaks = new Map([
      ["Real World", "Real<br>World"],
      ["Real World Examples", "Real World<br>Examples"],
      ["Gravitational Fields", "Gravitational<br>Fields"],
      ["Earth Winds", "Earth<br>Winds"],
      ["Field Metrics", "Field<br>Metrics"],
      ["Analytical Examples", "Analytical<br>Examples"],
    ]);
    const titleHtml = (text) => titleBreaks.get(text) || text;

    const createPanel = (id, titleText, titleSlotId, slotRoles, titleClass = "") => {
      const panel = document.createElement("section");
      panel.id = id;
      panel.className = "capture panel-surface";
      panel.style.cssText = `width:${spec.texture.widthPx}px;height:${spec.texture.heightPx}px`;

      const titleSlot = spec.slots.find((s) => s.id === titleSlotId);
      const title = document.createElement("h1");
      title.className = `title ${titleClass}`.trim();
      title.style.cssText = px(titleSlot);
      title.innerHTML = titleHtml(titleText);
      panel.appendChild(title);

      for (const slot of spec.slots.filter((s) => slotRoles.includes(s.role))) {
        const div = document.createElement("div");
        div.className = `slot ${slot.role}`;
        div.style.cssText = px(slot);
        panel.appendChild(div);
      }
      document.body.appendChild(panel);
      return panel;
    };

    const detailPanels = [
      {
        id: "gravity",
        title: "Gravitational Fields",
        kicker: "Mass bends the local field",
        body: "Earth and Moon share one reference plane, with Artemis II available as a mission overlay that carries the crewed Orion path through the gravity field.",
        topCaption: "",
        bottomCaption: "",
      },
      {
        id: "magnetism",
        title: "Magnetism",
        kicker: "",
        formula: String.raw`\vec{B}(\vec{r}) \;=\; \frac{\mu_0}{4\pi}\,\frac{3(\vec{m}\cdot\hat{r})\,\hat{r} - \vec{m}}{r^{3}}`,
        symbols: [
          [String.raw`\vec{B}`, "field vector"],
          [String.raw`\vec{r}`, "sample point"],
          [String.raw`\vec{m}`, "dipole moment"],
          [String.raw`\hat{r}`, "direction of r"],
          [String.raw`\mu_0`, "vacuum constant"],
        ],
        body: "Move the magnets; field lines recompute from their dipole moments.",
        topCaption: "",
        bottomCaption: "Rendering",
      },
      {
        id: "wind",
        title: "Earth Winds",
        kicker: "",
        body: "",
        topCaption: "",
        bottomCaption: "",
        controls: false,
      },
      {
        id: "aerodynamics",
        title: "Aerodynamics",
        kicker: "Wind-tunnel flow around a car",
        body: "The handle can be grabbed to move the slice.",
        topCaption: "",
        bottomCaption: "",
        controls: false,
      },
    ];

    const createExampleDetailPanel = (detail) => {
      const panel = document.createElement("section");
      panel.id = `example_detail_${detail.id}_panel`;
      panel.className = "capture panel-surface example-detail-panel";
      panel.style.cssText = `width:${spec.texture.widthPx}px;height:${spec.texture.heightPx}px`;

      const titleSlot = spec.slots.find((s) => s.id === "example_detail_title");
      const title = document.createElement("h1");
      title.className = "title examples";
      title.style.cssText = px(titleSlot);
      title.innerHTML = titleHtml(detail.title);
      panel.appendChild(title);

      if (detail.kicker || detail.body || detail.formula) {
        const infoSlot = spec.slots.find((s) => s.id === "example_info");
        const info = document.createElement("article");
        info.className = `detail-info${detail.symbols ? " has-symbols" : ""}`;
        info.style.cssText = px(infoSlot);
        let inner = "";
        if (detail.kicker) inner += `<div class="kicker">${detail.kicker}</div>`;
        if (detail.formula) {
          const formulaHtml = window.katex
            ? window.katex.renderToString(detail.formula, { throwOnError: false, displayMode: true })
            : detail.formula;
          inner += `<div class="detail-formula">${formulaHtml}</div>`;
        }
        if (detail.symbols) {
          const symbolsHtml = detail.symbols.map(([tex, label]) => {
            const rendered = window.katex
              ? window.katex.renderToString(tex, { throwOnError: false, displayMode: false })
              : tex;
            return `<span class="detail-symbol">${rendered} ${label}</span>`;
          }).join("");
          inner += `<div class="detail-symbols">${symbolsHtml}</div>`;
        }
        if (detail.body) inner += `<p>${detail.body}</p>`;
        info.innerHTML = inner;
        panel.appendChild(info);
      }

      if (detail.topCaption) {
        const top = document.createElement("div");
        top.className = "detail-caption";
        top.style.cssText = "top:520px";
        top.textContent = detail.topCaption;
        panel.appendChild(top);
      }

      if (detail.bottomCaption) {
        const bottom = document.createElement("div");
        bottom.className = "detail-caption";
        bottom.style.cssText = "top:648px";
        bottom.textContent = detail.bottomCaption;
        panel.appendChild(bottom);
      }

      let visibleSlotIds = detail.controls === false ? [] : ["example_mode_a", "example_mode_b", "example_mode_c"];
      if (detail.id === "gravity") {
        visibleSlotIds = ["variant_artemis"];
      } else if (detail.id === "magnetism") {
        visibleSlotIds = ["example_mode_magnetic_a", "example_mode_magnetic_b"];
      } else if (detail.showModes === false) {
        visibleSlotIds = ["variant_primary", "variant_secondary"];
      }
      for (const slot of spec.slots.filter((s) => visibleSlotIds.includes(s.id))) {
        const div = document.createElement("div");
        div.className = `slot ${slot.role}`;
        div.style.cssText = px(slot);
        panel.appendChild(div);
      }
      document.body.appendChild(panel);
    };

    const createArtemisDetailPanel = () => {
      const panel = document.createElement("section");
      panel.id = "example_detail_gravity_artemis_panel";
      panel.className = "capture panel-surface example-detail-panel";
      panel.style.cssText = `width:${spec.texture.widthPx}px;height:${spec.texture.heightPx}px`;

      const titleSlot = spec.slots.find((s) => s.id === "example_detail_title");
      const title = document.createElement("h1");
      title.className = "title examples";
      title.style.cssText = px(titleSlot);
      title.innerHTML = titleHtml("Gravitational Fields");
      panel.appendChild(title);

      const map = document.createElement("article");
      map.className = "artemis-map-card";
      map.innerHTML = `<img src="./assets/artemis_2_map_october_2021.jpg" alt="">`;
      panel.appendChild(map);
      document.body.appendChild(panel);
    };

    createPanel("panel", "Vector Fields", "title", []);
    createPanel("examples_panel", "Real World Examples", "examples_title", ["example_card"], "examples");
    const createTheoryPanel = () => {
      createPanel("theory_panel", "Theory", "theory_title", [], "examples");
    };

    const createTheoryMotionPanel = () => {
      createPanel("theory_panel_motion", "Theory", "theory_title", [], "examples");
    };

    createTheoryPanel();
    createTheoryMotionPanel();
    for (const detail of detailPanels) {
      createExampleDetailPanel(detail);
    }
    createArtemisDetailPanel();

    const mathMarkup = (tex, cls) => {
      const html = window.katex
        ? window.katex.renderToString(tex, { throwOnError: false, displayMode: false })
        : tex;
      return `<span class="formula ${cls}">${html}</span>`;
    };

    const theoryHeroMarkup = () => `
      <div class="main-card-hero theory" aria-hidden="true">
        ${mathMarkup(String.raw`\displaystyle \nabla=\left\langle{\partial\over\partial x},{\partial\over\partial y},{\partial\over\partial z}\right\rangle`, "nabla-formula")}
        ${mathMarkup(String.raw`\nabla`, "nabla-mark")}
        ${mathMarkup(String.raw`\text{gradient}\quad\text{divergence}\quad\text{curl}`, "nabla-label")}
      </div>`;

    const mainCardHeroMarkup = (id) => {
      if (id === "theory") return theoryHeroMarkup();
      if (id === "examples") return `<div class="main-card-hero examples" aria-hidden="true"></div>`;
      return "";
    };

    const theoryCardHeroMarkup = (id) => {
      if (id === "definition") {
        return `
          <div class="theory-card-hero" aria-hidden="true">
            ${mathMarkup(String.raw`\mathbf{F}:\mathbb{R}^{n}\to\mathbb{R}^{n}`, "primary")}
            ${mathMarkup(String.raw`\mathbf{x}\mapsto\mathbf{F}(\mathbf{x})`, "secondary")}
            ${mathMarkup(String.raw`\mathbb{R}^{n}`, "mark")}
          </div>`;
      }
      if (id === "metrics") {
        return `
          <div class="theory-card-hero" aria-hidden="true">
            ${mathMarkup(String.raw`\nabla\cdot\mathbf{F}\quad\nabla\times\mathbf{F}`, "primary")}
            ${mathMarkup(String.raw`\text{sources}\quad\text{rotation}`, "secondary")}
            ${mathMarkup(String.raw`\nabla`, "mark")}
          </div>`;
      }
      if (id === "patterns") {
        return `
          <div class="theory-card-hero" aria-hidden="true">
            ${mathMarkup(String.raw`\mathbf{F}(x,y,z)=\langle x,y,z\rangle`, "primary")}
            ${mathMarkup(String.raw`\nabla\cdot\mathbf{F}=3`, "secondary")}
            ${mathMarkup(String.raw`\langle x,y,z\rangle`, "mark")}
          </div>`;
      }
      return "";
    };

    for (const step of spec.steps) {
      const slot = spec.slots.find((s) => s.id === `card_${step.id}`);
      for (const state of ["normal", "active", "pressed"]) {
        const card = document.createElement("article");
        card.id = `card_${step.id}_${state}`;
        card.className = "capture card";
        card.dataset.step = step.id;
        card.dataset.state = state;
        card.style.cssText = `width:${slot.px.width}px;height:${slot.px.height}px`;
        card.innerHTML = `${mainCardHeroMarkup(step.id)}<span class="num">${step.index}</span><h2>${titleHtml(step.title)}</h2>`;
        document.body.appendChild(card);
      }
    }

    if (spec.theoryCards) {
      for (const card of spec.theoryCards) {
        const slot = spec.slots.find((s) => s.id === `card_${card.id}`);
        if (!slot) continue;
        for (const state of ["normal", "active", "pressed"]) {
          const el = document.createElement("article");
          el.id = `card_${card.id}_${state}`;
          el.className = "capture card";
          el.dataset.kind = "theory-card";
          el.dataset.card = card.id;
          el.dataset.state = state;
          el.style.cssText = `width:${slot.px.width}px;height:${slot.px.height}px`;
          el.innerHTML = `${theoryCardHeroMarkup(card.id)}<span class="num">${card.index}</span><h2>${titleHtml(card.title)}</h2>`;
          document.body.appendChild(el);
        }
      }
    }

    for (const example of spec.examples) {
      const slot = spec.slots.find((s) => s.id === `example_${example.id}`);
      const heroes = {
        gravity: { src: "../Assets/Images/gravitational-field-earth-moon.png", pos: "58% 50%" },
        magnetism: { src: "../Assets/Images/magnet-dipole.png", pos: "50% 48%" },
        wind: { src: "../Assets/Images/earth-satellite-view.jpg", pos: "50% 50%" },
        aerodynamics: { src: "../Assets/Images/aerodynamics-wind-tunnel.jpg", pos: "50% 52%" },
      };
      for (const state of ["normal", "active", "pressed"]) {
        const card = document.createElement("article");
        card.id = `example_${example.id}_${state}`;
        card.className = "capture example-card";
        card.dataset.state = state;
        card.style.cssText = `width:${slot.px.width}px;height:${slot.px.height}px`;
        const hero = heroes[example.id];
        const heroMarkup = hero
          ? `<img class="example-hero" src="${hero.src}" style="object-position:${hero.pos}" alt="">`
          : "";
        card.innerHTML = `${heroMarkup}<span class="num">${example.index}</span><h2>${titleHtml(example.title)}</h2>`;
        document.body.appendChild(card);
      }
    }

    for (const nav of [{ id: "back", label: "Back" }, { id: "next", label: "Next" }]) {
      const slot = spec.slots.find((s) => s.id === `nav_${nav.id}`);
      for (const state of ["normal", "pressed"]) {
        const button = document.createElement("div");
        button.id = `nav_${nav.id}_${state}`;
        button.className = "capture nav";
        button.dataset.state = state;
        button.style.cssText = `width:${slot.px.width}px;height:${slot.px.height}px`;
        button.textContent = nav.label;
        document.body.appendChild(button);
      }
    }

    const examplesBackSlot = spec.slots.find((s) => s.id === "examples_back");
    for (const state of ["normal", "pressed"]) {
      const button = document.createElement("div");
      button.id = `examples_back_${state}`;
      button.className = "capture nav";
      button.dataset.state = state;
      button.style.cssText = `width:${examplesBackSlot.px.width}px;height:${examplesBackSlot.px.height}px;font-size:40px`;
      button.textContent = "Back";
      document.body.appendChild(button);
    }

    const utilities = [
      { id: "utility_follow_on", slot: "utility_follow", label: "Follow", state: "on" },
      { id: "utility_follow_off", slot: "utility_follow", label: "Fixed", state: "off" },
      { id: "utility_follow_pressed", slot: "utility_follow", label: "Follow", state: "pressed" },
      { id: "utility_fold_open", slot: "utility_fold", label: "Fold", state: "open" },
      { id: "utility_fold_closed", slot: "utility_fold", label: "Open", state: "closed" },
      { id: "utility_fold_pressed", slot: "utility_fold", label: "Fold", state: "pressed" },
      { id: "utility_plane_floor_on", slot: "utility_plane_floor", label: "Reset", state: "on" },
      { id: "utility_plane_floor_off", slot: "utility_plane_floor", label: "Reset", state: "off" },
      { id: "utility_plane_floor_pressed", slot: "utility_plane_floor", label: "Reset", state: "pressed" },
      { id: "utility_plane_front_on", slot: "utility_plane_front", label: "Proxy", state: "on", proxy: true },
      { id: "utility_plane_front_off", slot: "utility_plane_front", label: "Proxy", state: "off", proxy: true },
      { id: "utility_plane_front_pressed", slot: "utility_plane_front", label: "Proxy", state: "pressed", proxy: true },
    ];

    for (const utility of utilities) {
      const slot = spec.slots.find((s) => s.id === utility.slot);
      const button = document.createElement("div");
      button.id = utility.id;
      button.className = "capture utility" + (utility.proxy ? " proxy" : "");
      button.dataset.state = utility.state;
      button.style.cssText = `width:${slot.px.width}px;height:${slot.px.height}px`;
      button.textContent = utility.label;
      document.body.appendChild(button);
    }

    for (const state of ["normal", "active", "pressed"]) {
      const slot = spec.slots.find((s) => s.id === "variant_primary");
      const button = document.createElement("div");
      button.id = `variant_${state}`;
      button.className = "capture variant";
      button.dataset.state = state;
      button.style.cssText = `width:${slot.px.width}px;height:${slot.px.height}px`;
      document.body.appendChild(button);
    }

    for (const state of ["normal", "active", "pressed"]) {
      const slot = spec.slots.find((s) => s.id === "variant_artemis");
      const button = document.createElement("div");
      button.id = `variant_artemis_${state}`;
      button.className = "capture variant artemis-variant";
      button.dataset.state = state;
      button.style.cssText = `width:${slot.px.width}px;height:${slot.px.height}px`;
      button.innerHTML = `<div class="mission-copy"><b>Artemis II Mission</b><span>Crewed Orion trajectory around the Moon and back to Earth.</span></div>`;
      document.body.appendChild(button);
    }

    const overlaySpecs = [
      { id: "overlay_card_hover", slot: "card_theory", classes: "overlay card hover" },
      { id: "overlay_card_selected", slot: "card_theory", classes: "overlay card selected" },
      { id: "overlay_card_pressed", slot: "card_theory", classes: "overlay card pressed" },
      { id: "overlay_example_hover", slot: "example_gravity", classes: "overlay example hover" },
      { id: "overlay_example_selected", slot: "example_gravity", classes: "overlay example selected" },
      { id: "overlay_example_pressed", slot: "example_gravity", classes: "overlay example pressed" },
      { id: "overlay_nav_hover", slot: "nav_next", classes: "overlay nav hover" },
      { id: "overlay_nav_pressed", slot: "nav_next", classes: "overlay nav pressed" },
      { id: "overlay_utility_hover", slot: "utility_follow", classes: "overlay utility hover" },
      { id: "overlay_utility_pressed", slot: "utility_follow", classes: "overlay utility pressed" },
    ];

    for (const item of overlaySpecs) {
      const slot = spec.slots.find((s) => s.id === item.slot);
      const overlay = document.createElement("div");
      overlay.id = item.id;
      overlay.className = `capture ${item.classes}`;
      overlay.style.cssText = `width:${slot.px.width}px;height:${slot.px.height}px`;
      document.body.appendChild(overlay);
    }

    for (const state of ["hover", "pressed"]) {
      const cursor = document.createElement("div");
      cursor.id = `cursor_${state}`;
      cursor.className = `capture cursor ${state}`;
      document.body.appendChild(cursor);
    }

    const panelWash = document.createElement("div");
    panelWash.id = "panel_cursor_wash";
    panelWash.className = "capture panel-cursor-wash";
    document.body.appendChild(panelWash);

    // Mount baked mesh-gradient backgrounds (HyperbolicStarLogo technique).
    // Deterministic frozen time per element so bakes are reproducible; state
    // drives brightness/palette so active cards read blue-lit.
    const ACTIVE_PALETTE = ["#0e1626", "#15314f", "#2b8dff", "#1f6fd0", "#10395f", "#3aa0ff", "#0b1220"];
    const seedTime = (s) => {
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 997;
      return 5 + (h % 48) * 0.5; // deterministic 5..29
    };
    const mountGrad = (el, opts) => {
      const canvas = document.createElement("canvas");
      canvas.className = "grad-canvas";
      el.insertBefore(canvas, el.firstChild);
      const w = el.clientWidth || el.getBoundingClientRect().width;
      const h = el.clientHeight || el.getBoundingClientRect().height;
      window.mountMeshGradient(canvas, Object.assign({ width: w, height: h }, opts));
    };

    document.querySelectorAll(".panel-surface:not(#theory_panel)").forEach((el) => {
      mountGrad(el, { time: seedTime(el.id || "panel"), brightness: 0.32, grain: 0.055, vignette: 0.64, noiseScale: 0.78 });
    });
    document.querySelectorAll(".card:not(.overlay), .example-card:not(.overlay)").forEach((el) => {
      const state = el.dataset.state || "normal";
      if (state === "active") {
        mountGrad(el, { time: seedTime(el.id), brightness: 0.36, grain: 0.05, vignette: 0.42, noiseScale: 0.7, colors: ACTIVE_PALETTE });
      } else if (state === "pressed") {
        mountGrad(el, { time: seedTime(el.id), brightness: 0.17, grain: 0.05, vignette: 0.52, noiseScale: 0.8 });
      } else {
        mountGrad(el, { time: seedTime(el.id), brightness: 0.25, grain: 0.05, vignette: 0.5, noiseScale: 0.8 });
      }
    });

    window.storyUiReady = true;
  </script>
</body>
</html>
