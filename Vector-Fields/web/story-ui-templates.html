<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story UI Templates</title>
  <style>
    :root {
      --panel: #202221;
      --panel-2: #2a2d2d;
      --panel-3: #343737;
      --accent: #d8d6cf;
      --line: rgba(232, 229, 220, 0.54);
      --line-soft: rgba(232, 229, 220, 0.18);
      --text: #f4f1e9;
      --muted: #bdb9b1;
      --quiet: #8f8b84;
      --active: #555757;
      --active-ink: #fffaf0;
      --pressed: #3f4242;
    }

    @font-face {
      font-family: NunitoSansLocal;
      src: url("../Assets/Fonts/Nunito_Sans/NunitoSans.ttf");
      font-weight: 200 1000;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
      color: var(--text);
      font-family: NunitoSansLocal, "Avenir Next", system-ui, sans-serif;
    }

    body {
      display: grid;
      gap: 34px;
      padding: 48px;
      align-items: start;
      justify-items: start;
    }

    .capture {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      color: var(--text);
    }

    .panel-surface {
      background:
        radial-gradient(circle at 16% 0%, rgba(244, 241, 233, 0.16), rgba(244, 241, 233, 0) 34%),
        linear-gradient(145deg, #323534 0%, #202221 58%, #151716 100%);
      border: 3px solid var(--line);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.14),
        inset 0 -34px 82px rgba(0,0,0,0.24);
    }

    .panel-surface::before {
      content: "";
      position: absolute;
      left: 70px;
      right: 70px;
      top: 224px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), rgba(255,255,255,0.12));
    }

    .title {
      position: absolute;
      display: flex;
      align-items: center;
      margin: 0;
      color: var(--text);
      font-size: 92px;
      line-height: 1;
      letter-spacing: 0;
      font-weight: 820;
    }

    .title.examples {
      font-size: 58px;
      font-weight: 780;
    }

    .slot {
      position: absolute;
      border-radius: 32px;
      border: 2px solid var(--line-soft);
      background: rgba(255,255,255,0.035);
    }

    .slot.progress {
      border-radius: 28px;
      background: rgba(255,255,255,0.025);
    }

    .card {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02)),
        var(--panel-2);
      border: 2px solid rgba(235,242,246,0.42);
      border-radius: 28px;
      box-shadow:
        0 18px 44px rgba(0,0,0,0.28);
    }

    .card[data-state="active"] {
      color: var(--active-ink);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.06)),
        var(--active);
      border-color: rgba(255,255,255,0.88);
      box-shadow:
        0 0 0 8px rgba(232,229,220,0.16),
        0 20px 48px rgba(0,0,0,0.34);
    }

    .card[data-state="pressed"] {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01)),
        var(--pressed);
      border-color: rgba(235,242,246,0.72);
      transform: scale(0.984);
    }

    .card .num {
      position: absolute;
      left: 30px;
      top: 25px;
      color: var(--quiet);
      font-size: 28px;
      line-height: 1;
      font-weight: 740;
      letter-spacing: 0.08em;
    }

    .card[data-state="active"] .num {
      color: #e4e0d4;
    }

    .card h2 {
      position: absolute;
      left: 112px;
      right: 32px;
      top: 40px;
      margin: 0;
      color: currentColor;
      font-size: 48px;
      line-height: 1;
      font-weight: 760;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .example-card {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.025)),
        var(--panel-2);
      border: 2px solid rgba(235,242,246,0.46);
      border-radius: 28px;
      box-shadow:
        0 20px 48px rgba(0,0,0,0.30);
    }

    .example-card[data-state="active"] {
      color: var(--active-ink);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.20), rgba(255,255,255,0.06)),
        var(--active);
      border-color: rgba(255,255,255,0.9);
      box-shadow:
        0 0 0 8px rgba(232,229,220,0.17),
        0 22px 52px rgba(0,0,0,0.35);
    }

    .example-card[data-state="pressed"] {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.012)),
        var(--pressed);
      border-color: rgba(235,242,246,0.76);
      transform: scale(0.986);
    }

    .example-card .num {
      position: absolute;
      left: 46px;
      top: 50%;
      color: var(--quiet);
      font-size: 28px;
      line-height: 1;
      font-weight: 720;
      letter-spacing: 0.08em;
      transform: translateY(-50%);
    }

    .example-card[data-state="active"] .num {
      color: #e4e0d4;
    }

    .example-card h2 {
      position: absolute;
      left: 150px;
      right: 58px;
      top: 50%;
      margin: 0;
      color: currentColor;
      font-size: 64px;
      line-height: 1;
      font-weight: 730;
      letter-spacing: 0;
      transform: translateY(-50%);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav {
      display: grid;
      place-items: center;
      border-radius: 22px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.09), rgba(255,255,255,0.015)),
        var(--panel-3);
      border: 2px solid rgba(235,242,246,0.54);
      color: var(--text);
      font-size: 46px;
      line-height: 1;
      font-weight: 780;
      box-shadow:
        0 18px 40px rgba(0,0,0,0.28);
    }

    .nav[data-state="pressed"] {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01)),
        var(--pressed);
      transform: scale(0.984);
    }

    .utility {
      display: grid;
      place-items: center;
      border-radius: 20px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02)),
        #3c3f3f;
      border: 2px solid rgba(235,242,246,0.52);
      color: var(--text);
      font-size: 34px;
      line-height: 1;
      font-weight: 650;
      box-shadow:
        0 12px 28px rgba(0,0,0,0.26);
    }

    .utility[data-state="off"],
    .utility[data-state="closed"] {
      color: var(--muted);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.07), rgba(255,255,255,0.01)),
        #292c2c;
      border-color: rgba(235,242,246,0.32);
    }

    .utility[data-state="pressed"] {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01)),
        var(--pressed);
      transform: scale(0.984);
    }

    .overlay {
      background: transparent;
    }

    .overlay::before,
    .overlay::after,
    .cursor::before,
    .cursor::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .overlay.card::before,
    .overlay.example::before {
      inset: 4px;
      border-radius: 24px;
      border: 3px solid rgba(250, 248, 239, 0.82);
      background:
        linear-gradient(90deg, rgba(255,255,255,0.15), rgba(255,255,255,0.02) 34%, rgba(255,255,255,0.09)),
        radial-gradient(circle at 86% 50%, rgba(255,255,255,0.22), rgba(255,255,255,0) 38%);
      box-shadow:
        inset 0 0 28px rgba(255,255,255,0.10),
        0 0 20px rgba(245,242,232,0.22);
    }

    .overlay.card.selected::before,
    .overlay.example.selected::before {
      inset: 3px;
      border-width: 4px;
      border-radius: 24px;
      border-color: rgba(255, 252, 242, 0.96);
      background:
        linear-gradient(90deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02) 44%, rgba(255,255,255,0.08)),
        radial-gradient(circle at 12% 50%, rgba(255,255,255,0.18), rgba(255,255,255,0) 34%);
      box-shadow:
        inset 0 0 28px rgba(255,255,255,0.10),
        0 0 22px rgba(245,242,232,0.22);
    }

    .overlay.card.pressed::before,
    .overlay.example.pressed::before {
      inset: 8px;
      border-width: 3px;
      border-radius: 20px;
      border-color: rgba(255, 252, 242, 0.74);
      background: rgba(255,255,255,0.11);
      box-shadow:
        inset 0 0 24px rgba(255,255,255,0.18),
        0 0 10px rgba(245,242,232,0.16);
    }

    .overlay.nav::before,
    .overlay.utility::before {
      inset: 4px;
      border-radius: 18px;
      border: 3px solid rgba(250, 248, 239, 0.84);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.02)),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.24), rgba(255,255,255,0) 42%);
      box-shadow:
        0 0 18px rgba(245,242,232,0.22);
    }

    .overlay.nav.pressed::before,
    .overlay.utility.pressed::before {
      inset: 7px;
      border-color: rgba(255, 252, 242, 0.72);
      background: rgba(255,255,255,0.11);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.17);
    }

    .overlay.utility::before {
      border-radius: 16px;
    }

    .cursor {
      width: 72px;
      height: 72px;
      background: transparent;
    }

    .cursor::before {
      inset: 9px;
      border-radius: 999px;
      border: 6px solid rgba(255, 252, 242, 0.9);
      box-shadow:
        inset 0 0 12px rgba(255,255,255,0.22),
        0 0 20px rgba(245,242,232,0.28);
    }

    .cursor::after {
      left: 50%;
      top: 50%;
      width: 11px;
      height: 11px;
      border-radius: 999px;
      transform: translate(-50%, -50%);
      background: rgba(255, 252, 242, 0.96);
      box-shadow: 0 0 14px rgba(245,242,232,0.34);
    }

    .cursor.pressed::before {
      inset: 13px;
      border-width: 7px;
      background: rgba(255,255,255,0.12);
    }

    .cursor.pressed::after {
      width: 15px;
      height: 15px;
    }

    .panel-cursor-wash {
      width: 256px;
      height: 256px;
      background:
        radial-gradient(circle at 50% 50%,
          rgba(255, 252, 242, 0.44) 0%,
          rgba(255, 252, 242, 0.26) 16%,
          rgba(255, 252, 242, 0.12) 34%,
          rgba(255, 252, 242, 0.04) 56%,
          rgba(255, 252, 242, 0) 74%);
    }

    .panel-cursor-wash::before {
      inset: 58px;
      border-radius: 999px;
      border: 4px solid rgba(255, 252, 242, 0.34);
      box-shadow:
        inset 0 0 20px rgba(255,255,255,0.14),
        0 0 26px rgba(245,242,232,0.16);
    }

    .panel-cursor-wash::after {
      inset: 84px;
      border-radius: 999px;
      background:
        repeating-linear-gradient(135deg,
          rgba(255,255,255,0.16) 0 4px,
          rgba(255,255,255,0) 4px 12px);
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <script src="./story-ui-layout.browser.js"></script>
  <script>
    const spec = window.STORY_UI_LAYOUT;
    const px = (slot) => {
      const p = slot.px;
      return `left:${p.x}px;top:${p.y}px;width:${p.width}px;height:${p.height}px`;
    };

    const createPanel = (id, titleText, titleSlotId, slotRoles, titleClass = "") => {
      const panel = document.createElement("section");
      panel.id = id;
      panel.className = "capture panel-surface";
      panel.style.cssText = `width:${spec.texture.widthPx}px;height:${spec.texture.heightPx}px;border-radius:${spec.panel.cornerRadiusPx}px`;

      const titleSlot = spec.slots.find((s) => s.id === titleSlotId);
      const title = document.createElement("h1");
      title.className = `title ${titleClass}`.trim();
      title.style.cssText = px(titleSlot);
      title.textContent = titleText;
      panel.appendChild(title);

      for (const slot of spec.slots.filter((s) => slotRoles.includes(s.role))) {
        const div = document.createElement("div");
        div.className = `slot ${slot.role}`;
        div.style.cssText = px(slot);
        panel.appendChild(div);
      }
      document.body.appendChild(panel);
    };

    createPanel("panel", "Guide", "title", ["card", "progress"]);
    createPanel("examples_panel", "Real World Examples", "examples_title", ["example_card"], "examples");

    for (const step of spec.steps) {
      const slot = spec.slots.find((s) => s.id === `card_${step.id}`);
      for (const state of ["normal", "active", "pressed"]) {
        const card = document.createElement("article");
        card.id = `card_${step.id}_${state}`;
        card.className = "capture card";
        card.dataset.state = state;
        card.style.cssText = `width:${slot.px.width}px;height:${slot.px.height}px`;
        card.innerHTML = `<span class="num">${step.index}</span><h2>${step.title}</h2>`;
        document.body.appendChild(card);
      }
    }

    for (const example of spec.examples) {
      const slot = spec.slots.find((s) => s.id === `example_${example.id}`);
      for (const state of ["normal", "active", "pressed"]) {
        const card = document.createElement("article");
        card.id = `example_${example.id}_${state}`;
        card.className = "capture example-card";
        card.dataset.state = state;
        card.style.cssText = `width:${slot.px.width}px;height:${slot.px.height}px`;
        card.innerHTML = `<span class="num">${example.index}</span><h2>${example.title}</h2>`;
        document.body.appendChild(card);
      }
    }

    for (const nav of [{ id: "back", label: "Back" }, { id: "next", label: "Next" }]) {
      const slot = spec.slots.find((s) => s.id === `nav_${nav.id}`);
      for (const state of ["normal", "pressed"]) {
        const button = document.createElement("div");
        button.id = `nav_${nav.id}_${state}`;
        button.className = "capture nav";
        button.dataset.state = state;
        button.style.cssText = `width:${slot.px.width}px;height:${slot.px.height}px`;
        button.textContent = nav.label;
        document.body.appendChild(button);
      }
    }

    const examplesBackSlot = spec.slots.find((s) => s.id === "examples_back");
    for (const state of ["normal", "pressed"]) {
      const button = document.createElement("div");
      button.id = `examples_back_${state}`;
      button.className = "capture nav";
      button.dataset.state = state;
      button.style.cssText = `width:${examplesBackSlot.px.width}px;height:${examplesBackSlot.px.height}px;font-size:40px`;
      button.textContent = "Back";
      document.body.appendChild(button);
    }

    const utilities = [
      { id: "utility_follow_on", slot: "utility_follow", label: "Follow", state: "on" },
      { id: "utility_follow_off", slot: "utility_follow", label: "Fixed", state: "off" },
      { id: "utility_follow_pressed", slot: "utility_follow", label: "Follow", state: "pressed" },
      { id: "utility_fold_open", slot: "utility_fold", label: "Fold", state: "open" },
      { id: "utility_fold_closed", slot: "utility_fold", label: "Open", state: "closed" },
      { id: "utility_fold_pressed", slot: "utility_fold", label: "Fold", state: "pressed" },
      { id: "utility_plane_floor_on", slot: "utility_plane_floor", label: "Floor", state: "on" },
      { id: "utility_plane_floor_off", slot: "utility_plane_floor", label: "Floor", state: "off" },
      { id: "utility_plane_floor_pressed", slot: "utility_plane_floor", label: "Floor", state: "pressed" },
      { id: "utility_plane_front_on", slot: "utility_plane_front", label: "Front", state: "on" },
      { id: "utility_plane_front_off", slot: "utility_plane_front", label: "Front", state: "off" },
      { id: "utility_plane_front_pressed", slot: "utility_plane_front", label: "Front", state: "pressed" },
    ];

    for (const utility of utilities) {
      const slot = spec.slots.find((s) => s.id === utility.slot);
      const button = document.createElement("div");
      button.id = utility.id;
      button.className = "capture utility";
      button.dataset.state = utility.state;
      button.style.cssText = `width:${slot.px.width}px;height:${slot.px.height}px`;
      button.textContent = utility.label;
      document.body.appendChild(button);
    }

    const overlaySpecs = [
      { id: "overlay_card_hover", slot: "card_intro", classes: "overlay card hover" },
      { id: "overlay_card_selected", slot: "card_intro", classes: "overlay card selected" },
      { id: "overlay_card_pressed", slot: "card_intro", classes: "overlay card pressed" },
      { id: "overlay_example_hover", slot: "example_gravity", classes: "overlay example hover" },
      { id: "overlay_example_selected", slot: "example_gravity", classes: "overlay example selected" },
      { id: "overlay_example_pressed", slot: "example_gravity", classes: "overlay example pressed" },
      { id: "overlay_nav_hover", slot: "nav_next", classes: "overlay nav hover" },
      { id: "overlay_nav_pressed", slot: "nav_next", classes: "overlay nav pressed" },
      { id: "overlay_utility_hover", slot: "utility_follow", classes: "overlay utility hover" },
      { id: "overlay_utility_pressed", slot: "utility_follow", classes: "overlay utility pressed" },
    ];

    for (const item of overlaySpecs) {
      const slot = spec.slots.find((s) => s.id === item.slot);
      const overlay = document.createElement("div");
      overlay.id = item.id;
      overlay.className = `capture ${item.classes}`;
      overlay.style.cssText = `width:${slot.px.width}px;height:${slot.px.height}px`;
      document.body.appendChild(overlay);
    }

    for (const state of ["hover", "pressed"]) {
      const cursor = document.createElement("div");
      cursor.id = `cursor_${state}`;
      cursor.className = `capture cursor ${state}`;
      document.body.appendChild(cursor);
    }

    const panelWash = document.createElement("div");
    panelWash.id = "panel_cursor_wash";
    panelWash.className = "capture panel-cursor-wash";
    document.body.appendChild(panelWash);

    window.storyUiReady = true;
  </script>
</body>
</html>
