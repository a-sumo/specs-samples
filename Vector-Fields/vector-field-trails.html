<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Field Presets</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; }
        canvas { display: block; }
        .controls {
            position: fixed;
            top: 10px;
            right: 10px;
            color: #fff;
            font-size: 12px;
            background: rgba(0,0,0,0.75);
            padding: 15px;
            border-radius: 8px;
            font-family: system-ui, sans-serif;
            min-width: 200px;
        }
        .controls h3 { margin-bottom: 10px; color: #8af; }
        .controls label {
            display: block;
            margin: 8px 0 4px;
        }
        .controls select, .controls input[type="range"] {
            width: 100%;
        }
        .controls select {
            padding: 5px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
        }
        .preset-desc {
            font-size: 10px;
            color: #888;
            margin-top: 5px;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
        }
        hr { border: none; border-top: 1px solid #333; margin: 12px 0; }
    </style>
</head>
<body>
    <div class="controls">
        <h3>Vector Field Trails</h3>
        
        <label>Preset:</label>
        <select id="preset">
            <option value="0">Curl Noise</option>
            <option value="1">Tornado</option>
            <option value="2">Attractor</option>
            <option value="3">Waves</option>
            <option value="4">Lorenz</option>
            <option value="5">Torus Flow</option>
            <option value="6">Sink/Source</option>
            <option value="7">Turbulence</option>
            <option value="8">Helix</option>
            <option value="9">Galaxy</option>
        </select>
        <div class="preset-desc" id="presetDesc">Smooth divergence-free turbulent flow</div>
        
        <hr>
        
        <label>Trail Length: <span id="lengthVal">0.4</span></label>
        <input type="range" id="trailLength" min="0.1" max="1.0" step="0.05" value="0.4">
        
        <label>Speed: <span id="speedVal">1.0</span></label>
        <input type="range" id="speed" min="0.1" max="3.0" step="0.1" value="1.0">
        
        <label>Field Scale: <span id="scaleVal">1.0</span></label>
        <input type="range" id="fieldScale" min="0.2" max="3.0" step="0.1" value="1.0">
        
        <label>Line Count: <span id="countVal">600</span></label>
        <input type="range" id="lineCount" min="100" max="2000" step="100" value="600">
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>

const PRESET_DESCRIPTIONS = [
    "Smooth divergence-free turbulent flow",
    "Spiraling vortex pulling upward",
    "Strange attractor with chaotic orbits",
    "Sinusoidal wave interference pattern",
    "Lorenz system - butterfly attractor",
    "Flow along a torus surface",
    "Alternating sinks and sources",
    "Multi-scale turbulent noise",
    "Double helix DNA-like spiral",
    "Spiral galaxy rotation curve"
];

const CONFIG = {
    numLines: 600,
    segmentsPerLine: 48,
    bounds: 3.5,
    stepSize: 0.06,
};

// ============================================================
// VERTEX SHADER WITH ALL PRESETS
// ============================================================
const vertexShader = `
    attribute float lineIndex;
    attribute float segmentIndex;
    attribute vec3 seedPosition;
    
    uniform float uTime;
    uniform float uTrailLength;
    uniform float uSpeed;
    uniform float uFieldScale;
    uniform float uStepSize;
    uniform int uPreset;
    
    varying float vAlpha;
    varying vec3 vColor;
    varying float vSegment;
    
    //----------------------------------------------
    // NOISE FUNCTIONS
    //----------------------------------------------
    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
    vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
    
    float snoise(vec3 v) {
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        
        vec3 i = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        
        i = mod289(i);
        vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
            + i.y + vec4(0.0, i1.y, i2.y, 1.0))
            + i.x + vec4(0.0, i1.x, i2.x, 1.0));
            
        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;
        
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        
        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0) * 2.0 + 1.0;
        vec4 s1 = floor(b1) * 2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        
        vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
        
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }
    
    vec3 curlNoise(vec3 p) {
        float e = 0.1;
        float n1 = snoise(p + vec3(0.0, e, 0.0));
        float n2 = snoise(p - vec3(0.0, e, 0.0));
        float n3 = snoise(p + vec3(0.0, 0.0, e));
        float n4 = snoise(p - vec3(0.0, 0.0, e));
        float n5 = snoise(p + vec3(e, 0.0, 0.0));
        float n6 = snoise(p - vec3(e, 0.0, 0.0));
        
        return vec3(
            (n2 - n1) - (n4 - n3),
            (n4 - n3) - (n6 - n5),
            (n6 - n5) - (n2 - n1)
        );
    }
    
    //----------------------------------------------
    // VECTOR FIELD PRESETS
    //----------------------------------------------
    
    // 0: Curl Noise - smooth turbulence
    vec3 fieldCurlNoise(vec3 p, float t) {
        vec3 curl = curlNoise(p * uFieldScale + t * 0.05);
        return normalize(curl + 0.001) * 0.4;
    }
    
    // 1: Tornado - upward spiral
    vec3 fieldTornado(vec3 p, float t) {
        float r = length(p.xz);
        float angle = atan(p.z, p.x);
        float lift = 0.3 / (r + 0.5);
        float spin = 1.0 / (r + 0.3);
        
        return vec3(
            -sin(angle) * spin,
            lift + 0.1,
            cos(angle) * spin
        ) * 0.4;
    }
    
    // 2: Strange Attractor
    vec3 fieldAttractor(vec3 p, float t) {
        float a = 0.2, b = 0.2, c = 5.7;
        return vec3(
            -p.y - p.z,
            p.x + a * p.y,
            b + p.z * (p.x - c)
        ) * 0.08;
    }
    
    // 3: Waves - sinusoidal interference
    vec3 fieldWaves(vec3 p, float t) {
        float s = uFieldScale;
        return vec3(
            sin(p.y * s + t) * cos(p.z * s * 0.5),
            sin(p.z * s + t * 1.1) * cos(p.x * s * 0.5),
            sin(p.x * s + t * 0.9) * cos(p.y * s * 0.5)
        ) * 0.35;
    }
    
    // 4: Lorenz System
    vec3 fieldLorenz(vec3 p, float t) {
        float sigma = 10.0;
        float rho = 28.0;
        float beta = 8.0 / 3.0;
        
        vec3 scaled = p * 0.1; // Scale down
        return vec3(
            sigma * (scaled.y - scaled.x),
            scaled.x * (rho - scaled.z) - scaled.y,
            scaled.x * scaled.y - beta * scaled.z
        ) * 0.015;
    }
    
    // 5: Torus Flow
    vec3 fieldTorus(vec3 p, float t) {
        float R = 2.0; // Major radius
        float r = length(vec2(length(p.xz) - R, p.y));
        
        // Tangent to torus
        float angle = atan(p.z, p.x);
        vec3 tangent = vec3(-sin(angle), 0.0, cos(angle));
        
        // Add poloidal rotation
        float polAngle = atan(p.y, length(p.xz) - R);
        vec3 poloidal = vec3(
            cos(angle) * (-sin(polAngle)),
            cos(polAngle),
            sin(angle) * (-sin(polAngle))
        );
        
        return (tangent * 0.7 + poloidal * 0.3) * 0.4;
    }
    
    // 6: Sink/Source pattern
    vec3 fieldSinkSource(vec3 p, float t) {
        vec3 v = vec3(0.0);
        
        // Multiple sources and sinks
        vec3 source1 = vec3(2.0, 0.0, 0.0);
        vec3 sink1 = vec3(-2.0, 0.0, 0.0);
        vec3 source2 = vec3(0.0, 2.0, 0.0);
        vec3 sink2 = vec3(0.0, -2.0, 0.0);
        
        vec3 d1 = p - source1;
        vec3 d2 = p - sink1;
        vec3 d3 = p - source2;
        vec3 d4 = p - sink2;
        
        v += normalize(d1) / (dot(d1, d1) + 0.5);
        v -= normalize(d2) / (dot(d2, d2) + 0.5);
        v += normalize(d3) / (dot(d3, d3) + 0.5);
        v -= normalize(d4) / (dot(d4, d4) + 0.5);
        
        return v * 0.3;
    }
    
    // 7: Multi-scale Turbulence
    vec3 fieldTurbulence(vec3 p, float t) {
        vec3 v = vec3(0.0);
        float amp = 1.0;
        float freq = uFieldScale;
        
        for (int i = 0; i < 4; i++) {
            v += curlNoise(p * freq + t * 0.05 * float(i + 1)) * amp;
            amp *= 0.5;
            freq *= 2.0;
        }
        
        return normalize(v + 0.001) * 0.35;
    }
    
    // 8: Double Helix
    vec3 fieldHelix(vec3 p, float t) {
        float helixRadius = 1.5;
        float twist = 2.0;
        
        // Two strands offset by PI
        float angle1 = p.y * twist + t;
        float angle2 = p.y * twist + t + 3.14159;
        
        vec3 center1 = vec3(cos(angle1) * helixRadius, 0.0, sin(angle1) * helixRadius);
        vec3 center2 = vec3(cos(angle2) * helixRadius, 0.0, sin(angle2) * helixRadius);
        
        vec3 toCenter1 = center1 - p;
        vec3 toCenter2 = center2 - p;
        
        float d1 = length(toCenter1.xz);
        float d2 = length(toCenter2.xz);
        
        vec3 attract = (toCenter1 / (d1 + 0.3) + toCenter2 / (d2 + 0.3)) * 0.3;
        vec3 up = vec3(0.0, 0.4, 0.0);
        
        return attract + up;
    }
    
    // 9: Galaxy - differential rotation
    vec3 fieldGalaxy(vec3 p, float t) {
        float r = length(p.xz) + 0.1;
        float angle = atan(p.z, p.x);
        
        // Rotation speed decreases with radius (Keplerian)
        float omega = 1.0 / sqrt(r);
        
        // Spiral arm density wave
        float armPhase = angle - log(r) * 2.0 + t * 0.2;
        float armStrength = sin(armPhase * 2.0) * 0.3;
        
        vec3 tangent = vec3(-sin(angle), 0.0, cos(angle));
        vec3 radial = vec3(cos(angle), 0.0, sin(angle));
        
        // Flatten to disk
        float flatten = -p.y * 0.5;
        
        return tangent * omega * 0.5 + radial * armStrength * 0.2 + vec3(0.0, flatten, 0.0);
    }
    
    //----------------------------------------------
    // FIELD SELECTOR
    //----------------------------------------------
    vec3 getField(vec3 p, float t) {
        if (uPreset == 0) return fieldCurlNoise(p, t);
        if (uPreset == 1) return fieldTornado(p, t);
        if (uPreset == 2) return fieldAttractor(p, t);
        if (uPreset == 3) return fieldWaves(p, t);
        if (uPreset == 4) return fieldLorenz(p, t);
        if (uPreset == 5) return fieldTorus(p, t);
        if (uPreset == 6) return fieldSinkSource(p, t);
        if (uPreset == 7) return fieldTurbulence(p, t);
        if (uPreset == 8) return fieldHelix(p, t);
        if (uPreset == 9) return fieldGalaxy(p, t);
        return fieldCurlNoise(p, t);
    }
    
    //----------------------------------------------
    // COLOR BASED ON PRESET
    //----------------------------------------------
    vec3 getColor(int preset, vec3 vel, vec3 pos, float seg) {
        vec3 baseColor;
        
        if (preset == 0) baseColor = vec3(0.2, 0.5, 1.0);      // Blue - curl
        if (preset == 1) baseColor = vec3(0.8, 0.4, 0.1);      // Orange - tornado
        if (preset == 2) baseColor = vec3(0.9, 0.2, 0.4);      // Red - attractor
        if (preset == 3) baseColor = vec3(0.2, 0.9, 0.6);      // Cyan - waves
        if (preset == 4) baseColor = vec3(0.7, 0.3, 0.9);      // Purple - lorenz
        if (preset == 5) baseColor = vec3(0.3, 0.8, 0.3);      // Green - torus
        if (preset == 6) baseColor = vec3(1.0, 0.8, 0.2);      // Yellow - sink/source
        if (preset == 7) baseColor = vec3(0.5, 0.5, 0.9);      // Light blue - turbulence
        if (preset == 8) baseColor = vec3(0.9, 0.5, 0.7);      // Pink - helix
        if (preset == 9) baseColor = vec3(0.8, 0.7, 0.4);      // Gold - galaxy
        
        // Add velocity-based variation
        vec3 velColor = abs(normalize(vel + 0.001)) * 0.3;
        
        return mix(baseColor, baseColor + velColor, 0.5);
    }
    
    //----------------------------------------------
    // MAIN
    //----------------------------------------------
    void main() {
        float timeOffset = uTime * uSpeed * 0.25;
        float linePhase = lineIndex * 0.0137;
        
        // Animate seed
        vec3 seed = seedPosition;
        float cycle = mod(timeOffset + linePhase, 5.0);
        seed += getField(seedPosition, 0.0) * cycle * 1.5;
        
        // Integrate
        vec3 pos = seed;
        int steps = int(segmentIndex * 47.0);
        
        for (int i = 0; i < 48; i++) {
            if (i >= steps) break;
            pos += getField(pos, uTime * 0.15) * uStepSize;
        }
        
        // Trail visibility
        float headPos = fract(timeOffset * 0.35 + linePhase);
        float dist = segmentIndex - headPos;
        if (dist < 0.0) dist += 1.0;
        
        float visibility = 1.0 - dist / uTrailLength;
        visibility = clamp(visibility, 0.0, 1.0);
        visibility = smoothstep(0.0, 0.2, visibility);
        visibility *= smoothstep(0.0, 0.02, segmentIndex);
        
        vAlpha = visibility;
        vSegment = segmentIndex;
        
        vec3 vel = getField(pos, uTime * 0.15);
        vColor = getColor(uPreset, vel, pos, segmentIndex);
        
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
`;

const fragmentShader = `
    varying float vAlpha;
    varying vec3 vColor;
    varying float vSegment;
    
    void main() {
        if (vAlpha < 0.01) discard;
        
        // Brighten head
        vec3 color = vColor;
        color += smoothstep(0.6, 1.0, vAlpha) * 0.6;
        
        gl_FragColor = vec4(color, vAlpha * 0.85);
    }
`;

// ============================================================
// SCENE SETUP
// ============================================================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(7, 5, 7);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x030308);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// ============================================================
// CREATE GEOMETRY
// ============================================================
let trails;
const uniforms = {
    uTime: { value: 0 },
    uTrailLength: { value: 0.4 },
    uSpeed: { value: 1.0 },
    uFieldScale: { value: 1.0 },
    uStepSize: { value: CONFIG.stepSize },
    uPreset: { value: 0 },
};

function createTrails(numLines) {
    if (trails) {
        scene.remove(trails);
        trails.geometry.dispose();
    }
    
    const { segmentsPerLine, bounds } = CONFIG;
    const totalVerts = numLines * segmentsPerLine;
    
    const positions = new Float32Array(totalVerts * 3);
    const lineIndices = new Float32Array(totalVerts);
    const segmentIndices = new Float32Array(totalVerts);
    const seedPositions = new Float32Array(totalVerts * 3);
    
    for (let line = 0; line < numLines; line++) {
        const sx = (Math.random() - 0.5) * bounds * 2;
        const sy = (Math.random() - 0.5) * bounds * 2;
        const sz = (Math.random() - 0.5) * bounds * 2;
        
        for (let seg = 0; seg < segmentsPerLine; seg++) {
            const i = line * segmentsPerLine + seg;
            
            positions[i * 3] = sx;
            positions[i * 3 + 1] = sy;
            positions[i * 3 + 2] = sz;
            
            lineIndices[i] = line;
            segmentIndices[i] = seg / (segmentsPerLine - 1);
            
            seedPositions[i * 3] = sx;
            seedPositions[i * 3 + 1] = sy;
            seedPositions[i * 3 + 2] = sz;
        }
    }
    
    const indices = [];
    for (let line = 0; line < numLines; line++) {
        for (let seg = 0; seg < segmentsPerLine - 1; seg++) {
            const i = line * segmentsPerLine + seg;
            indices.push(i, i + 1);
        }
    }
    
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('lineIndex', new THREE.BufferAttribute(lineIndices, 1));
    geometry.setAttribute('segmentIndex', new THREE.BufferAttribute(segmentIndices, 1));
    geometry.setAttribute('seedPosition', new THREE.BufferAttribute(seedPositions, 3));
    geometry.setIndex(indices);
    
    const material = new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        uniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
    });
    
    trails = new THREE.LineSegments(geometry, material);
    scene.add(trails);
}

createTrails(CONFIG.numLines);

// Subtle grid
const grid = new THREE.GridHelper(10, 20, 0x222233, 0x111118);
scene.add(grid);

// ============================================================
// CONTROLS
// ============================================================
document.getElementById('preset').addEventListener('change', (e) => {
    uniforms.uPreset.value = parseInt(e.target.value);
    document.getElementById('presetDesc').textContent = PRESET_DESCRIPTIONS[e.target.value];
});

document.getElementById('trailLength').addEventListener('input', (e) => {
    uniforms.uTrailLength.value = parseFloat(e.target.value);
    document.getElementById('lengthVal').textContent = e.target.value;
});

document.getElementById('speed').addEventListener('input', (e) => {
    uniforms.uSpeed.value = parseFloat(e.target.value);
    document.getElementById('speedVal').textContent = e.target.value;
});

document.getElementById('fieldScale').addEventListener('input', (e) => {
    uniforms.uFieldScale.value = parseFloat(e.target.value);
    document.getElementById('scaleVal').textContent = e.target.value;
});

document.getElementById('lineCount').addEventListener('input', (e) => {
    const count = parseInt(e.target.value);
    document.getElementById('countVal').textContent = count;
    createTrails(count);
});

// ============================================================
// ANIMATE
// ============================================================
function animate() {
    requestAnimationFrame(animate);
    uniforms.uTime.value = performance.now() * 0.001;
    controls.update();
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
    </script>
</body>
</html>
