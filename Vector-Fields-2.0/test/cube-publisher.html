<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cube Publisher</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #0a0d11; color: #ccc; font: 12px/1.4 'SF Mono', monospace; padding: 12px; }
  .bar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  input { background: #161b22; color: #aaa; border: 1px solid #333; padding: 3px 6px; font: inherit; border-radius: 3px; }
  button { padding: 3px 12px; font: inherit; cursor: pointer; border-radius: 3px; }
  #connectBtn { background: #1a2a1a; color: #7c7; border: 1px solid #2a5a3a; }
  #connectBtn.on { background: #0a2a0a; color: #4e4; border-color: #1a5a1a; }
  .stat { color: #555; font-size: 11px; }
  canvas { border: 1px solid #222; image-rendering: pixelated; display: block; margin-top: 8px; }
  label { color: #666; font-size: 11px; }
</style>
</head>
<body>

<div class="bar">
  <input id="relay" value="ws://localhost:8766" style="width:180px" placeholder="relay URL">
  <input id="channel" value="vector-field" style="width:100px" placeholder="channel">
  <button id="connectBtn">Connect</button>
  <label><input type="checkbox" id="syncCam"> Sync LS Camera</label>
  <span class="stat" id="stat"></span>
</div>
<canvas id="c" width="256" height="256"></canvas>

<script>
// ---- Config ----
const W = 256, H = 256;
const QUAD_ID = 'panel';
const FRAME_INTERVAL = 66; // ~15fps

const canvas = document.getElementById('c');
canvas.style.width = '512px'; canvas.style.height = '512px';
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const imgData = ctx.createImageData(W, H);
const px = imgData.data;

// ---- 3D state ----
let S = 15;
let cubePos = [0, 0, -50];
let camPos = [0, 0, -120];
let camQuat = [0, 0, 0, 1];

function buildVerts(h) {
  return [[-h,-h,-h],[h,-h,-h],[h,h,-h],[-h,h,-h],[-h,-h,h],[h,-h,h],[h,h,h],[-h,h,h]];
}
let verts = buildVerts(S);
const edges = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];

function quatMat(q) {
  const [x,y,z,w] = q;
  return [
    [1-2*(y*y+z*z), 2*(x*y-z*w), 2*(x*z+y*w)],
    [2*(x*y+z*w), 1-2*(x*x+z*z), 2*(y*z-x*w)],
    [2*(x*z-y*w), 2*(y*z+x*w), 1-2*(x*x+y*y)]
  ];
}

function project(vx,vy,vz) {
  const wx=vx+cubePos[0]-camPos[0], wy=vy+cubePos[1]-camPos[1], wz=vz+cubePos[2]-camPos[2];
  const m=quatMat(camQuat);
  const cx=m[0][0]*wx+m[1][0]*wy+m[2][0]*wz;
  const cy=m[0][1]*wx+m[1][1]*wy+m[2][1]*wz;
  const cz=m[0][2]*wx+m[1][2]*wy+m[2][2]*wz;
  if (cz<=0.1) return null;
  const f=1/Math.tan(63.5*Math.PI/360);
  return [(cx*f/cz*0.5+0.5)*W, (0.5-cy*f/cz*0.5)*H];
}

function drawLine(x0,y0,x1,y1,r,g,b) {
  let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  let sx=x0<x1?1:-1, sy=y0<y1?1:-1, err=dx-dy;
  while(true) {
    for(let oy=0;oy<2;oy++) for(let ox=0;ox<2;ox++) {
      const ix=Math.round(x0)+ox, iy=Math.round(y0)+oy;
      if(ix>=0&&ix<W&&iy>=0&&iy<H){const o=(iy*W+ix)*4;px[o]=r;px[o+1]=g;px[o+2]=b;px[o+3]=255;}
    }
    if(Math.abs(x0-x1)<1&&Math.abs(y0-y1)<1) break;
    const e2=2*err;
    if(e2>-dy){err-=dy;x0+=sx;} if(e2<dx){err+=dx;y0+=sy;}
  }
}

function drawCircle(cx,cy,rad,r,g,b) {
  for(let a=0;a<Math.PI*2;a+=0.05){
    const ix=Math.round(cx+Math.cos(a)*rad), iy=Math.round(cy+Math.sin(a)*rad);
    if(ix>=0&&ix<W&&iy>=0&&iy<H){const o=(iy*W+ix)*4;px[o]=r;px[o+1]=g;px[o+2]=b;px[o+3]=255;}
  }
}

function render() {
  px.fill(0);
  for(let i=0;i<px.length;i+=4){px[i]=13;px[i+1]=17;px[i+2]=23;px[i+3]=255;}
  const pr=verts.map(([x,y,z])=>project(x,y,z));
  for(const[a,b]of edges){const pa=pr[a],pb=pr[b];if(pa&&pb)drawLine(pa[0],pa[1],pb[0],pb[1],96,165,250);}
  for(const p of pr){if(p)drawCircle(p[0],p[1],4,147,197,253);}
  ctx.putImageData(imgData,0,0);
}

// ---- Binary frame encoding (portal-demo pattern) ----
function encodeBinaryRGBA(srcCanvas, id) {
  const w = srcCanvas.width, h = srcCanvas.height;
  const rgba = srcCanvas.getContext('2d').getImageData(0, 0, w, h).data;
  const idB = new TextEncoder().encode(id);
  const buf = new Uint8Array(11 + idB.length + rgba.length);
  buf[0] = 1;
  buf[1] = w & 0xff; buf[2] = (w >> 8) & 0xff;
  buf[3] = h & 0xff; buf[4] = (h >> 8) & 0xff;
  buf[9] = 1; // RGBA
  buf[10] = idB.length;
  buf.set(idB, 11);
  buf.set(rgba, 11 + idB.length);
  return buf;
}

// ---- Pixel change detection (portal-demo pattern) ----
let prevPixels = null;
function pixelsChanged() {
  const cur = ctx.getImageData(0, 0, W, H).data;
  if (!prevPixels || prevPixels.length !== cur.length) {
    prevPixels = new Uint8Array(cur); return true;
  }
  for (let i = 0; i < cur.length; i += 64) {
    if (cur[i] !== prevPixels[i]) { prevPixels = new Uint8Array(cur); return true; }
  }
  return false;
}

// ---- Scene ops (portal-demo pattern: register as publisher immediately) ----
function sendScene() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({
    event: 'scene',
    payload: { ops: [
      { op: 'create', id: QUAD_ID, w: W, h: H, x: 0, y: 0, z: 0.05, layer: 0, interactive: false }
    ]}
  }));
}

// ---- WebSocket (portal-demo pattern) ----
let ws = null;
let connected = false;
let manualStop = false;
let reconnectTimer = null;
let reconnectDelay = 500;
let framesSent = 0;
let lastFrameSend = 0;

const btn = document.getElementById('connectBtn');
const statEl = document.getElementById('stat');

function connect() {
  if (connected || manualStop) return;
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }

  const url = document.getElementById('relay').value.trim();
  const ch = document.getElementById('channel').value.trim() || 'vector-field';
  btn.textContent = 'Connecting...'; btn.className = '';

  try {
    ws = new WebSocket(url + (url.includes('?') ? '&' : '?') + 'channel=' + encodeURIComponent(ch));
    ws.binaryType = 'arraybuffer';
  } catch (e) { btn.textContent = 'Connect'; scheduleReconnect(); return; }

  ws.onopen = () => {
    connected = true;
    reconnectDelay = 500;
    btn.textContent = 'Disconnect'; btn.className = 'on';
    sendScene(); // register as publisher immediately
    prevPixels = null;
    framesSent = 0;
  };

  ws.onmessage = (ev) => {
    // Ignore binary (we're a publisher, not subscriber)
    if (typeof ev.data !== 'string') return;
    try {
      const msg = JSON.parse(ev.data);
      if (msg.event === 'sub_joined') {
        // New subscriber: resend scene + force next frame
        sendScene();
        prevPixels = null;
      } else if (msg.event === 'interact' && msg.payload) {
        if (msg.payload.type === 'camera_state' && document.getElementById('syncCam').checked) {
          camPos = msg.payload.position;
          camQuat = msg.payload.rotation;
        } else if (msg.payload.type === 'field_state' && msg.payload.collider) {
          const c = msg.payload.collider;
          if (c.center) cubePos = c.center;
          if (c.halfSize !== undefined) { S = c.halfSize; verts = buildVerts(S); }
        }
      }
    } catch (e) {}
  };

  ws.onclose = () => {
    connected = false;
    btn.className = '';
    if (!manualStop) {
      btn.textContent = 'Reconnecting...';
      scheduleReconnect();
    } else {
      btn.textContent = 'Connect';
    }
  };
  ws.onerror = () => {};
}

function scheduleReconnect() {
  if (reconnectTimer || manualStop) return;
  reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, reconnectDelay);
  reconnectDelay = Math.min(reconnectDelay * 1.5, 3000);
}

btn.addEventListener('click', () => {
  if (connected) {
    manualStop = true;
    ws.close();
  } else {
    manualStop = false;
    connect();
  }
});

// ---- Render + stream loop ----
function frame() {
  render();

  if (connected && ws && ws.readyState === WebSocket.OPEN) {
    const now = Date.now();
    if (now - lastFrameSend >= FRAME_INTERVAL && ws.bufferedAmount < 500000) {
      lastFrameSend = now;
      if (pixelsChanged()) {
        ws.send(encodeBinaryRGBA(canvas, QUAD_ID));
        framesSent++;
        statEl.textContent = framesSent + 'f';
      }
    }
  }

  requestAnimationFrame(frame);
}

// Auto-connect on load
render();
connect();
requestAnimationFrame(frame);
</script>
</body>
</html>
